name: Build and Push Admin Web to GHCR

on:
  push:
    branches: [ "main" ]
    paths:
      - "admin_web/**"
      - ".github/workflows/build-admin-web.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Admin Web Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./admin_web
          file: ./admin_web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/catu-v2-admin-web:latest
            ghcr.io/${{ github.repository_owner }}/catu-v2-admin-web:${{ github.sha }}
