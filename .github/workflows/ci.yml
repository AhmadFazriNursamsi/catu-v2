name: CI

on:
  pull_request:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PostgreSQL sungguhan untuk tes integrasi (penerimaan atomik, nomor pelayanan, status, ulasan, standar skema).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit & contract tests
        run: npx jest
      - name: HTTP error contract (e2e, tanpa basis data)
        run: npx jest --config ./test/jest-e2e.json error-contract
      # Skema dibangun dari nol oleh migrasi (backend/drizzle), persis seperti produksi; tidak ada berkas dump.
      - name: Integration tests (PostgreSQL, skema dari migrasi)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/catu_test
        run: npm run test:integration
      - name: Build
        run: npm run build
      # Informatif: temuan high saat ini berasal dari rantai transitif firebase-admin (perlu upgrade mayor).
      # Jadikan blocking (hapus continue-on-error) setelah firebase-admin di-upgrade.
      - name: Dependency audit (production, high+)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  admin-web:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: admin_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Semua tampilan dirender dengan payload HTML; satu pun yang lolos mentah menggagalkan build (XSS tersimpan).
      - name: Render tampilan dengan payload XSS
        run: node test/xss-render.check.cjs
