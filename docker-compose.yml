services:
  postgres:
    image: postgres:16-alpine
    container_name: catu_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: catu_v2_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /Users/admin/.gemini/antigravity-cli/brain/bbf474c9-06e7-4dd8-89fb-679b58a5c795/schema.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: catu_backend
    restart: always
    ports:
      - "3005:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: catu_v2_db
      PORT: 3000
    depends_on:
      - postgres

  admin_web:
    build:
      context: ./admin_web
      dockerfile: Dockerfile
    container_name: catu_admin_web
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./admin_web:/usr/share/nginx/html
    depends_on:
      - backend

volumes:
  postgres_data:
