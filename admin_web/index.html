<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CATU Admin Portal - Sistem Informasi Pelayanan Gereja</title>
  <link rel="icon" type="image/png" href="assets/images/logoCatu.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .church-bg {
      background-image: linear-gradient(135deg, rgba(10, 17, 40, 0.92), rgba(15, 23, 42, 0.88), rgba(30, 41, 59, 0.94)), url('assets/images/church_1.jpg');
      background-size: cover;
      background-position: center;
    }
    .cross-bg {
      background-image: linear-gradient(rgba(248, 250, 252, 0.96), rgba(241, 245, 249, 0.96)), url('assets/images/cross_banner.jpg');
      background-size: cover;
      background-position: center;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    
    /* Agentation Inspector Highlight Box */
    #agentation-inspector-box {
      position: fixed;
      pointer-events: none;
      border: 2px dashed #f59e0b;
      background-color: rgba(245, 158, 11, 0.15);
      border-radius: 6px;
      z-index: 99990;
      transition: all 0.05s ease;
      display: none;
    }
    #agentation-inspector-label {
      position: absolute;
      top: -24px;
      left: 0;
      background: #0f172a;
      color: #f59e0b;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .agentation-pin {
      position: absolute;
      z-index: 99995;
      transform: translate(-50%, -50%);
      cursor: pointer;
      animation: pinPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes pinPop {
      0% { transform: translate(-50%, -50%) scale(0); }
      80% { transform: translate(-50%, -50%) scale(1.15); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }
    @keyframes slideInRight {
      0% { transform: translateX(100%) scale(0.95); opacity: 0; }
      100% { transform: translateX(0) scale(1); opacity: 1; }
    }
    .animate-slide-in {
      animation: slideInRight 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    .animate-fade-in {
      animation: fadeIn 0.2s ease-out forwards;
    }
  </style>
</head>
<body class="h-full text-slate-800 antialiased">
  <div id="app" class="h-full"></div>

  <!-- Agentation Inspector Highlight Box -->
  <div id="agentation-inspector-box">
    <div id="agentation-inspector-label">element</div>
  </div>

  <!-- Agentation Pins Layer Container -->
  <div id="agentation-pins-layer" class="fixed inset-0 pointer-events-none z-[99992]"></div>

  <script>
    // Config & State
    const API_BASE = `http://${window.location.hostname}:3005`;
    let rawStoredUser = null;
    try {
      rawStoredUser = JSON.parse(localStorage.getItem('catu_admin_user') || 'null');
    } catch(e) { rawStoredUser = null; }

    // Load persisted Agentation annotations
    let rawStoredAnnotations = [];
    try {
      rawStoredAnnotations = JSON.parse(localStorage.getItem('catu_agentation_annotations') || '[]');
    } catch(e) { rawStoredAnnotations = []; }

    const state = {
      currentUser: (rawStoredUser && (rawStoredUser.roleCode === 'ADMIN' || rawStoredUser.role_code === 'ADMIN')) ? rawStoredUser : null,
      token: localStorage.getItem('catu_admin_token') || '',
      currentTab: 'overview',
      isSidebarOpen: localStorage.getItem('catu_sidebar_open') !== 'false',
      analytics: null,
      orders: [],
      users: [],
      provinsi: [],
      kabupatenKota: [],
      keuskupan: [],
      paroki: [],
      wilayah: [],
      lingkungan: [],
      ordo: [],
      roles: [],
      positions: [],
      masterSubTab: 'paroki',
      masterSearch: '',
      masterFilterKeuskupanId: '',
      masterFilterParokiId: '',
      masterFilterWilayahId: '',
      serviceCategories: [],
      masterDataList: [],
      isMasterLoading: false,
      activeMasterModal: null,
      modalParokiList: [],
      modalWilayahList: [],
      isSavingMaster: false,
      masterModalError: '',
      deleteConfirmModal: null,
      
      // Searches
      orderSearch: '',
      orderStatusFilter: 'ALL',
      orderCategoryFilter: 'ALL',
      
      umatSearch: '',
      umatFilterParoki: '',
      umatFilterLingkungan: '',

      pengurusSearch: '',
      pengurusFilterPosition: '',
      pengurusFilterParoki: '',

      romoParokiSearch: '',
      romoParokiFilterPosition: '',
      romoParokiFilterParoki: '',

      romoOrdoSearch: '',
      romoOrdoFilterOrdo: '',
      romoOrdoFilterPosition: '',

      approvalsSearch: '',
      approvalsFilterRole: '',
      approvalsFilterParoki: '',

      isLoading: false,
      loginLoading: false,
      loginError: '',
      testResults: null,
      isRunningTests: false,
      
      // Modals
      activeChatOrder: null,
      activeOrderDetail: null,
      activeUserProfile: null,
      activeEditUser: null,
      editKabupatenKotaList: [],
      editParokiList: [],
      editWilayahList: [],
      editLingkunganList: [],
      comboboxFilters: {},
      openCombobox: null,
      isSavingProfile: false,
      editFormError: '',
      toasts: [],
      actionConfirmModal: null,

      // 🎯 Agentation Visual Feedback System State
      agentation: {
        enabled: false,
        expanded: false,
        showDrawer: false,
        annotations: rawStoredAnnotations,
        pendingPin: null,
        activePinId: null,
        selectedCategory: 'BUG',
      }
    };

    // Render Main App Dispatcher (Preserving Active Input Focus & Caret Position)
    function renderApp() {
      const activeEl = document.activeElement;
      let focusedId = null;
      let selectionStart = null;
      let selectionEnd = null;

      if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA') && activeEl.id) {
        focusedId = activeEl.id;
        try {
          selectionStart = activeEl.selectionStart;
          selectionEnd = activeEl.selectionEnd;
        } catch (_) {}
      }

      const app = document.getElementById('app');
      if (!state.currentUser || (state.currentUser.roleCode !== 'ADMIN' && state.currentUser.role_code !== 'ADMIN')) {
        app.innerHTML = renderLoginPage();
        attachLoginListeners();
      } else {
        app.innerHTML = renderDashboardLayout();
        attachDashboardListeners();
      }
      try {
        lucide.createIcons();
      } catch(e) {}
      renderAgentationPins();

      // Restore focus and cursor position to the input smoothly
      if (focusedId) {
        const newEl = document.getElementById(focusedId);
        if (newEl && (newEl.tagName === 'INPUT' || newEl.tagName === 'TEXTAREA')) {
          newEl.focus();
          if (selectionStart !== null && selectionEnd !== null) {
            try {
              newEl.setSelectionRange(selectionStart, selectionEnd);
            } catch (_) {}
          }
        }
      }
    }

    // ══════════════════════════════════════════════════════════════════════════
    // 1. LOGIN PAGE
    // ══════════════════════════════════════════════════════════════════════════
    function renderLoginPage() {
      return `
        <div class="min-h-full flex flex-col lg:flex-row">
          <div class="church-bg lg:w-[54%] p-8 lg:p-14 flex flex-col justify-between text-white relative">
            <div>
              <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3.5">
                  <div class="w-12 h-12 rounded-xl bg-white p-1.5 shadow-lg border-2 border-amber-500 flex items-center justify-center">
                    <img src="assets/images/logoCatu.png" alt="CATU Logo" class="h-full object-contain" />
                  </div>
                  <div>
                    <h1 class="text-xl font-extrabold tracking-wider text-white">CATU WEB PORTAL</h1>
                    <p class="text-[11px] font-bold text-amber-400 tracking-wider">CARI & BANTU PELAYANAN GEREJA</p>
                  </div>
                </div>
                <div class="hidden sm:inline-flex items-center px-3 py-1 rounded-full bg-white/10 border border-white/20 text-xs font-semibold text-white/90">
                  <i data-lucide="shield-alert" class="w-3.5 h-3.5 mr-1.5 text-amber-400"></i>
                  Portal Khusus Administrator
                </div>
              </div>
            </div>

            <div class="my-12 lg:my-0 max-w-xl">
              <h2 class="text-3xl lg:text-4xl font-extrabold leading-tight tracking-tight text-white mb-4">
                Sistem Informasi & Manajemen<br/><span class="text-amber-400">Pelayanan Umat Katolik</span>
              </h2>
              <p class="text-slate-300 text-sm lg:text-base leading-relaxed mb-8">
                Platform terpusat untuk monitoring pelayanan Misa Kedukaan, Sakramen Perminyakan, verifikasi pendaftaran berjenjang, dan koordinasi lintas paroki.
              </p>

              <div class="space-y-4">
                <div class="flex items-start space-x-3.5 p-3.5 rounded-xl bg-white/5 border border-white/10 backdrop-blur-sm">
                  <div class="p-2 rounded-lg bg-amber-500/20 text-amber-400">
                    <i data-lucide="church" class="w-5 h-5"></i>
                  </div>
                  <div>
                    <h3 class="text-sm font-bold text-white">Integrasi Lintas Paroki & Ordo</h3>
                    <p class="text-xs text-slate-300">Pengelolaan permohonan pelayanan sakramental secara transparan dan terstruktur.</p>
                  </div>
                </div>

                <div class="flex items-start space-x-3.5 p-3.5 rounded-xl bg-white/5 border border-white/10 backdrop-blur-sm">
                  <div class="p-2 rounded-lg bg-emerald-500/20 text-emerald-400">
                    <i data-lucide="user-check" class="w-5 h-5"></i>
                  </div>
                  <div>
                    <h3 class="text-sm font-bold text-white">Persetujuan Akun Berjenjang</h3>
                    <p class="text-xs text-slate-300">Verifikasi pendaftaran Umat, Romo, dan Pengurus Lingkungan dengan satu klik.</p>
                  </div>
                </div>
              </div>
            </div>

            <div class="flex items-center text-xs text-slate-400 space-x-2 pt-6 border-t border-white/10">
              <i data-lucide="shield-check" class="w-4 h-4 text-emerald-400"></i>
              <span>CATU Platform v2.5.0 • Powered by NestJS & PostgreSQL 16</span>
            </div>
          </div>

          <div class="cross-bg lg:w-[46%] p-8 lg:p-14 flex items-center justify-center">
            <div class="w-full max-w-md bg-white rounded-3xl p-8 lg:p-10 shadow-2xl border border-slate-200">
              <div class="text-center mb-8">
                <img src="assets/images/logoCatu.png" alt="CATU Logo" class="h-16 mx-auto mb-4 object-contain" />
                <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Masuk Portal Admin</h2>
                <p class="text-xs text-slate-500 mt-1">Masukkan kredensial Administrator untuk mengakses dashboard.</p>
              </div>

              ${state.loginError ? `
                <div class="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs font-semibold flex items-start space-x-2.5">
                  <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0 text-red-600"></i>
                  <span>${state.loginError}</span>
                </div>
              ` : ''}

              <form id="loginForm" class="space-y-4">
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1.5">Nomor WhatsApp / HP</label>
                  <div class="relative rounded-xl shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                      <span class="text-sm mr-1">🇮🇩</span>
                      <span class="text-xs font-bold text-blue-900 border-r border-slate-300 pr-2">+62</span>
                    </div>
                    <input type="tel" id="phoneInput" required placeholder="89999999999" value="89999999999"
                      class="block w-full pl-16 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-900 focus:bg-white" />
                  </div>
                </div>

                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1.5">Kata Sandi</label>
                  <div class="relative rounded-xl shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                      <i data-lucide="lock" class="w-4 h-4 text-blue-900"></i>
                    </div>
                    <input type="password" id="passwordInput" required placeholder="••••••••" value="password123"
                      class="block w-full pl-10 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-900 focus:bg-white" />
                    <button type="button" id="togglePasswordBtn" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600">
                      <i data-lucide="eye" class="w-4 h-4"></i>
                    </button>
                  </div>
                </div>

                <div class="pt-2">
                  <button type="submit" id="submitBtn" ${state.loginLoading ? 'disabled' : ''}
                    class="w-full py-3.5 px-4 bg-blue-950 hover:bg-blue-900 text-white text-sm font-bold rounded-xl shadow-lg shadow-blue-950/20 flex items-center justify-center space-x-2 transition duration-200 disabled:opacity-50">
                    ${state.loginLoading ? `
                      <span class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                      <span>Memverifikasi...</span>
                    ` : `
                      <i data-lucide="log-in" class="w-4 h-4"></i>
                      <span>MASUK KE PORTAL ADMIN</span>
                    `}
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      `;
    }

    function attachLoginListeners() {
      const toggleBtn = document.getElementById('togglePasswordBtn');
      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          const pass = document.getElementById('passwordInput');
          pass.type = pass.type === 'password' ? 'text' : 'password';
        });
      }

      const form = document.getElementById('loginForm');
      if (form) {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const phone = document.getElementById('phoneInput').value.trim();
          const password = document.getElementById('passwordInput').value.trim();

          state.loginLoading = true;
          state.loginError = '';
          renderApp();

          try {
            const res = await fetch(`${API_BASE}/auth/admin/login`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ phoneNumber: phone, password }),
            });
            const data = await res.json();

            const isSuccess = (res.ok || res.status === 200 || data.statusCode === 200) &&
                              data.user && (data.user.roleCode === 'ADMIN' || data.user.role_code === 'ADMIN');

            if (isSuccess) {
              state.currentUser = data.user;
              state.token = data.accessToken || '';
              localStorage.setItem('catu_admin_user', JSON.stringify(data.user));
              localStorage.setItem('catu_admin_token', data.accessToken || '');
              state.loginLoading = false;
              state.loginError = '';
              renderApp();
              loadDashboardData();
            } else {
              state.loginError = data.message || 'Login gagal. Pastikan Anda menggunakan akun Administrator.';
              state.loginLoading = false;
              renderApp();
            }
          } catch (err) {
            state.loginError = `Gagal menghubungi server backend (${API_BASE}).`;
            state.loginLoading = false;
            renderApp();
          }
        });
      }
    }

    // ══════════════════════════════════════════════════════════════════════════
    // 2. DASHBOARD MAIN LAYOUT & SIDEBAR
    // ══════════════════════════════════════════════════════════════════════════
    function toggleSidebar() {
      state.isSidebarOpen = !state.isSidebarOpen;
      localStorage.setItem('catu_sidebar_open', state.isSidebarOpen);
      renderApp();
    }

    // ══════════════════════════════════════════════════════════════════════════
    // 2. DASHBOARD MAIN LAYOUT & SIDEBAR (COLLAPSIBLE / TUTUP BUKA)
    // ══════════════════════════════════════════════════════════════════════════
    function renderDashboardLayout() {
      const adminName = state.currentUser?.fullName || state.currentUser?.full_name || 'Super Admin CATU';
      const pendingApprovalsCount = state.users.filter(u => (u.account_status || u.accountStatus) === 'PENDING_APPROVAL').length;
      const activeUmatCount = state.users.filter(u => (u.role_code || u.roleCode) === 'UMAT' && (u.account_status || u.accountStatus) === 'APPROVED').length;
      const activePengurusCount = state.users.filter(u => (u.role_code || u.roleCode) === 'PENGURUS_LINGKUNGAN' && (u.account_status || u.accountStatus) === 'APPROVED').length;
      const activeRomoParokiCount = state.users.filter(u => (u.role_code || u.roleCode) === 'ROMO_PAROKI' && (u.account_status || u.accountStatus) === 'APPROVED').length;
      const activeRomoOrdoCount = state.users.filter(u => (u.role_code || u.roleCode) === 'ROMO_ORDO' && (u.account_status || u.accountStatus) === 'APPROVED').length;
      const activeAnnotationsCount = state.agentation.annotations.filter(a => !a.resolved).length;
      const isOpen = state.isSidebarOpen !== false;

      return `
        <div class="h-full flex relative overflow-hidden">
          <!-- Sidebar Nav (Left) - Collapsible -->
          <div class="${isOpen ? 'w-64' : 'w-20'} bg-slate-900 border-r border-slate-800 flex flex-col justify-between flex-shrink-0 transition-all duration-300 ease-in-out">
            <div class="overflow-y-auto custom-scrollbar">
              <!-- Sidebar Header -->
              ${isOpen ? `
                <div class="p-5 flex items-center justify-between border-b border-slate-800">
                  <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-xl bg-white p-1 shadow border border-amber-500 flex items-center justify-center flex-shrink-0">
                      <img src="assets/images/logoCatu.png" alt="CATU" class="h-full object-contain" />
                    </div>
                    <div>
                      <h2 class="text-sm font-extrabold text-white tracking-wide">CATU ADMIN</h2>
                      <p class="text-[9.5px] font-bold text-amber-400">PORTAL PUSAT SISTEM</p>
                    </div>
                  </div>
                  <button onclick="toggleSidebar()" class="p-1.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition" title="Tutup Sidebar">
                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                  </button>
                </div>
              ` : `
                <div class="p-3.5 flex flex-col items-center border-b border-slate-800 space-y-2">
                  <div class="w-10 h-10 rounded-xl bg-white p-1 shadow border border-amber-500 flex items-center justify-center flex-shrink-0">
                    <img src="assets/images/logoCatu.png" alt="CATU" class="h-full object-contain" />
                  </div>
                  <button onclick="toggleSidebar()" class="p-1 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition" title="Buka Sidebar">
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                  </button>
                </div>
              `}

              <!-- Nav Items -->
              <nav class="${isOpen ? 'p-3 space-y-4' : 'p-2 space-y-3'}">
                <div>
                  ${isOpen ? `<p class="px-3 text-[10px] font-extrabold uppercase tracking-wider text-slate-500 mb-1.5">Utama</p>` : `<div class="h-px bg-slate-800 my-1 mx-2"></div>`}
                  <div class="space-y-1">
                    ${renderNavItem('overview', 'layout-dashboard', 'Ringkasan & Analytics')}
                    ${renderNavItem('orders', 'clipboard-list', 'Manajemen Pelayanan', state.analytics?.orders?.pending)}
                  </div>
                </div>

                <div>
                  ${isOpen ? `<p class="px-3 text-[10px] font-extrabold uppercase tracking-wider text-slate-500 mb-1.5">Pengguna Aktif</p>` : `<div class="h-px bg-slate-800 my-1 mx-2"></div>`}
                  <div class="space-y-1">
                    ${renderNavItem('umat', 'users', 'Umat Katolik', activeUmatCount, 'bg-blue-600')}
                    ${renderNavItem('pengurus', 'briefcase', 'Pengurus Lingkungan', activePengurusCount, 'bg-indigo-600')}
                    ${renderNavItem('romo_paroki', 'church', 'Romo Paroki', activeRomoParokiCount, 'bg-emerald-600')}
                    ${renderNavItem('romo_ordo', 'cross', 'Romo Ordo (On-Demand)', activeRomoOrdoCount, 'bg-purple-600')}
                  </div>
                </div>

                <div>
                  ${isOpen ? `<p class="px-3 text-[10px] font-extrabold uppercase tracking-wider text-slate-500 mb-1.5">Tata Kelola & Data</p>` : `<div class="h-px bg-slate-800 my-1 mx-2"></div>`}
                  <div class="space-y-1">
                    ${renderNavItem('approvals', 'shield-check', 'Persetujuan Pendaftaran', pendingApprovalsCount, 'bg-amber-500')}
                    ${renderNavItem('master', 'map-pin', 'Master Data Gereja')}
                    ${renderNavItem('chat', 'messages-square', 'Monitoring Chat')}
                    ${renderNavItem('qa', 'flask-conical', 'QA & Live Tests')}
                  </div>
                </div>
              </nav>
            </div>

            <!-- Sidebar Bottom Action Section -->
            ${isOpen ? `
              <div class="p-4 border-t border-slate-800 space-y-2">
                <button onclick="toggleAgentationMode()"
                  class="w-full py-2.5 px-3 rounded-xl ${state.agentation.enabled ? 'bg-amber-500 text-slate-950 font-black ring-2 ring-amber-300' : 'bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold'} text-xs flex items-center justify-between transition shadow">
                  <div class="flex items-center space-x-2">
                    <i data-lucide="scan" class="w-4 h-4"></i>
                    <span>🎯 Agentation UI</span>
                  </div>
                  <span class="px-1.5 py-0.5 rounded-full text-[10px] ${state.agentation.enabled ? 'bg-slate-900 text-amber-400' : 'bg-amber-500/20 text-amber-400'} font-black">
                    ${activeAnnotationsCount}
                  </span>
                </button>

                <button id="logoutBtn" class="w-full py-2.5 px-3 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-400 text-xs font-bold flex items-center space-x-2 transition">
                  <i data-lucide="log-out" class="w-4 h-4"></i>
                  <span>Keluar Akun Admin</span>
                </button>
              </div>
            ` : `
              <div class="p-2.5 border-t border-slate-800 space-y-2 flex flex-col items-center">
                <button onclick="toggleAgentationMode()" title="🎯 Agentation UI (${activeAnnotationsCount} catatan)"
                  class="w-11 h-11 rounded-xl relative flex items-center justify-center ${state.agentation.enabled ? 'bg-amber-500 text-slate-950 font-black ring-2 ring-amber-300' : 'bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold'} text-xs transition shadow">
                  <i data-lucide="scan" class="w-5 h-5"></i>
                  ${activeAnnotationsCount > 0 ? `

    function renderNavItem(id, icon, label, badge, badgeColor = 'bg-red-500') {
      const active = state.currentTab === id;
      const isOpen = state.isSidebarOpen !== false;

      if (!isOpen) {
        return `
          <button onclick="setTab('${id}')" title="${label}"
            class="w-full relative flex items-center justify-center p-3 rounded-xl transition ${
              active ? 'bg-blue-950 text-amber-400 font-bold border border-blue-800 shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'
            }">
            <i data-lucide="${icon}" class="w-5 h-5 ${active ? 'text-amber-400' : ''}"></i>
            ${badge && parseInt(badge) > 0 ? `
              <span class="absolute top-1.5 right-1.5 w-2.5 h-2.5 rounded-full ${badgeColor} ring-2 ring-slate-900"></span>
            ` : ''}
          </button>
        `;
      }

      return `
        <button onclick="setTab('${id}')"
          class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold transition ${
            active ? 'bg-blue-950 text-white font-bold border border-blue-800' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'
          }">
          <div class="flex items-center space-x-3">
            <i data-lucide="${icon}" class="w-4 h-4 ${active ? 'text-amber-400' : ''}"></i>
            <span class="truncate">${label}</span>
          </div>
          ${badge && parseInt(badge) > 0 ? `
            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold text-white ${badgeColor}">${badge}</span>
          ` : ''}
        </button>
      `;
    }

    function getTabTitle(tab) {
      if (tab === 'overview') return 'Ringkasan & Analytics';
      if (tab === 'orders') return 'Manajemen Pelayanan';
      if (tab === 'umat') return 'Daftar Umat Katolik Aktif';
      if (tab === 'pengurus') return 'Daftar Pengurus Lingkungan Aktif';
      if (tab === 'romo_paroki') return 'Daftar Romo Paroki Aktif';
      if (tab === 'romo_ordo') return 'Daftar Romo Ordo Aktif (On-Demand)';
      if (tab === 'approvals') return 'Persetujuan Akun Pendaftaran Baru';
      if (tab === 'master') return 'Master Data Wilayah & Gereja';
      if (tab === 'chat') return 'Monitoring Group Chat Pelayanan';
      if (tab === 'qa') return 'QA & Live Test Runner';
      return tab;
    }

    function setTab(tab) {
      state.currentTab = tab;
      if (tab === 'master') {
        loadMasterData(state.masterSubTab || 'paroki');
      }
      renderApp();
    }

    function attachDashboardListeners() {
      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
          localStorage.removeItem('catu_admin_user');
          localStorage.removeItem('catu_admin_token');
          state.currentUser = null;
          state.token = '';
          renderApp();
        });
      }

      const refreshBtn = document.getElementById('refreshBtn');
      if (refreshBtn) {
        refreshBtn.addEventListener('click', () => {
          loadDashboardData();
        });
      }
    }

    // 3. TAB RENDERERS
    // ══════════════════════════════════════════════════════════════════════════
    function renderActiveTab() {
      if (state.currentTab === 'overview') return renderOverviewTab();
      if (state.currentTab === 'orders') return renderOrdersTab();
      if (state.currentTab === 'umat') return renderUmatTab();
      if (state.currentTab === 'pengurus') return renderPengurusTab();
      if (state.currentTab === 'romo_paroki') return renderRomoParokiTab();
      if (state.currentTab === 'romo_ordo') return renderRomoOrdoTab();
      if (state.currentTab === 'approvals') return renderApprovalsTab();
      if (state.currentTab === 'master') return renderMasterTab();
      if (state.currentTab === 'chat') return renderChatTab();
      if (state.currentTab === 'qa') return renderQATab();
      return '';
    }

                <div class="p-3 rounded-xl bg-emerald-50 text-emerald-700"><i data-lucide="users" class="w-6 h-6"></i></div>
                <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-blue-50 text-blue-700 border border-blue-200">${users.total_umat || 0} Umat</span>

              <div class="flex items-center justify-between mb-4">
                <div class="p-3 rounded-xl bg-purple-50 text-purple-700"><i data-lucide="church" class="w-6 h-6"></i></div>

            <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">

              <p class="text-xs font-bold text-slate-600">Backend & PostgreSQL</p>

        </div>

    // ── Tab: Orders ──
    function renderOrdersTab() {
      const q = state.orderSearch.toLowerCase();
      const filtered = state.orders.filter(o => {
        const oStatus = (o.status || '').toUpperCase();
        const oCat = (o.category_name || o.categoryName || '').toLowerCase();
        const oNum = (o.order_number || o.orderNumber || '').toLowerCase();

        const oPar = (o.paroki_name || o.parokiName || o.location_name || o.locationName || '').toLowerCase();

        if (state.orderCategoryFilter !== 'ALL' && !oCat.includes(state.orderCategoryFilter.toLowerCase())) return false;
        if (q) {
          if (!oNum.includes(q) && !oPem.includes(q) && !oPar.includes(q)) return false;
        }
        return true;
      });

      return `

                  </tr>

        </div>
      `;

    // ── Tab: Umat Katolik ──
    // ── Tab: Umat Katolik ──
    function renderUmatTab() {
      const q = (state.umatSearch || '').toLowerCase().trim();
      const hasFilter = state.umatSearch || state.umatFilterParoki || state.umatFilterLingkungan;

      // Extract unique paroki & lingkungan for filter options
      const allUmatUsers = state.users.filter(u => (u.role_code || u.roleCode || '').toUpperCase() === 'UMAT');
      const parokiList = state.paroki?.length > 0 ? state.paroki : Array.from(new Set(allUmatUsers.map(u => u.paroki_name).filter(Boolean))).map(name => ({ id: name, name }));
      const lingList = Array.from(new Set(
        allUmatUsers
          .filter(u => !state.umatFilterParoki || String(u.paroki_id) === String(state.umatFilterParoki) || u.paroki_name === state.umatFilterParoki)
          .map(u => u.lingkungan_name)
          .filter(Boolean)
      )).sort();

      const umats = state.users.filter(u => {
        const role = (u.role_code || u.roleCode || '').toUpperCase();
        const status = (u.account_status || u.accountStatus || '').toUpperCase();
        if (role !== 'UMAT' || status !== 'APPROVED') return false;

        if (state.umatFilterParoki) {
          const matchPar = String(u.paroki_id) === String(state.umatFilterParoki) || (u.paroki_name === state.umatFilterParoki);
          if (!matchPar) return false;
        }

        if (state.umatFilterLingkungan) {
          const matchLing = String(u.lingkungan_id) === String(state.umatFilterLingkungan) || (u.lingkungan_name === state.umatFilterLingkungan);
          if (!matchLing) return false;
        }

        if (q) {
          const name = (u.full_name || u.fullName || '').toLowerCase();
          const email = (u.email || '').toLowerCase();
          const phone = (u.phone_number || u.phoneNumber || '').toLowerCase();
          const par = (u.paroki_name || u.parokiName || '').toLowerCase();
          const ling = (u.lingkungan_name || '').toLowerCase();
          if (!name.includes(q) && !email.includes(q) && !phone.includes(q) && !par.includes(q) && !ling.includes(q)) return false;
        }
        return true;
      });

      return `
        <div class="space-y-6 animate-fade-in">
          <div class="bg-white rounded-3xl border border-slate-200/90 shadow-sm overflow-hidden">
            <!-- Filter Toolbar Header -->
            <div class="p-6 border-b border-slate-200/80 bg-gradient-to-r from-slate-50/90 via-white to-slate-50/60 flex flex-col lg:flex-row lg:items-center justify-between gap-4">

              <div class="relative w-full max-w-md">
                <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="umatSearchInput" placeholder="Cari nama umat, email, no. WhatsApp, paroki..." value="${state.umatSearch}"

                  class="w-full pl-10 pr-9 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-amber-500 shadow-2xs transition" />
                ${state.umatSearch ? `
                  <button onclick="state.umatSearch = ''; renderApp();" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-0.5" title="Hapus Pencarian">
                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                  </button>
                ` : ''}
              </div>

              <!-- Contextual Dropdown Filters -->
              <div class="flex flex-wrap items-center gap-3">
                <!-- Filter Paroki -->
                <div class="relative">
                  <select onchange="state.umatFilterParoki = this.value; renderApp();"
                    class="pl-3.5 pr-8 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-extrabold text-slate-800 focus:outline-none focus:ring-2 focus:ring-amber-500 shadow-2xs max-w-[210px] truncate">
                    <option value="">⛪ Semua Paroki</option>
                    ${parokiList.map(p => `
                      <option value="${p.id || p.name}" ${String(state.umatFilterParoki) === String(p.id || p.name) ? 'selected' : ''}>⛪ ${p.name}</option>
                    `).join('')}
                  </select>
                </div>

                <!-- Filter Lingkungan -->
                <div class="relative">
                  <select onchange="state.umatFilterLingkungan = this.value; renderApp();"
                    class="pl-3.5 pr-8 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-extrabold text-slate-800 focus:outline-none focus:ring-2 focus:ring-amber-500 shadow-2xs max-w-[200px] truncate">
                    <option value="">🏘️ Semua Lingkungan</option>
                    ${lingList.map(l => `
                      <option value="${l}" ${state.umatFilterLingkungan === l ? 'selected' : ''}>🏘️ ${l}</option>
                    `).join('')}
                  </select>
                </div>

                <!-- Reset Filters Button -->
                ${hasFilter ? `
                  <button onclick="state.umatSearch = ''; state.umatFilterParoki = ''; state.umatFilterLingkungan = ''; renderApp();"
                    class="inline-flex items-center space-x-1 px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-black transition shadow-2xs">
                    <i data-lucide="rotate-ccw" class="w-3.5 h-3.5 text-slate-500"></i>
                    <span>Reset</span>
                  </button>
                ` : ''}

                <!-- Counter Badge -->
                <span class="px-3.5 py-1.5 rounded-full bg-blue-50 text-blue-950 border border-blue-200 text-xs font-black shadow-2xs whitespace-nowrap">
                  ${umats.length} Umat Terdaftar
                </span>
              </div>
            </div>

            <!-- Table View -->
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead class="bg-gradient-to-r from-slate-100/90 via-slate-50 to-slate-100/80 text-slate-600 font-black border-b border-slate-200 tracking-wider uppercase text-[10.5px]">
                  <tr>
                    <th class="px-6 py-4">NAMA LENGKAP UMAT</th>
                    <th class="px-6 py-4">NO. WHATSAPP</th>
                    <th class="px-6 py-4">PAROKI</th>
                    <th class="px-6 py-4">LINGKUNGAN & WILAYAH</th>
                    <th class="px-6 py-4 text-center">STATUS AKUN</th>
                    <th class="px-6 py-4 text-right">AKSI</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 font-medium text-slate-700">
                  ${umats.length === 0 ? `
                    <tr>
                      <td colspan="6" class="text-center py-16 text-slate-400 space-y-3">
                        <div class="w-14 h-14 rounded-2xl bg-slate-50 border border-slate-200 flex items-center justify-center mx-auto text-slate-400">
                          <i data-lucide="users" class="w-7 h-7"></i>
                        </div>
                        <p class="font-extrabold text-slate-700 text-sm">Tidak ada data umat yang sesuai filter</p>
                        <p class="text-xs text-slate-400">Coba ubah kata kunci pencarian atau reset filter paroki dan lingkungan</p>
                      </td>
                    </tr>
                  ` : umats.map(u => `
                    <tr class="hover:bg-amber-50/30 transition duration-150 group">
                      <td class="px-6 py-4">
                        <div class="flex items-center space-x-3">
                          <div class="w-9 h-9 rounded-xl bg-blue-50 text-blue-900 border border-blue-200/80 flex items-center justify-center font-black text-xs shadow-2xs">
                            ${(u.full_name || 'U').charAt(0).toUpperCase()}

                          <div>
                            <p class="font-extrabold text-slate-900 text-xs">${u.full_name || 'Umat'}</p>
                            <p class="text-[10.5px] text-slate-400 font-semibold truncate max-w-xs">${u.email || '-'}</p>
                          </div>
                        </div>
                      </td>
                      <td class="px-6 py-4 font-bold text-slate-900">
                        <span class="inline-flex items-center space-x-1.5 text-xs">
                          <i data-lucide="phone" class="w-3.5 h-3.5 text-emerald-600"></i>
                          <span>${u.phone_number}</span>

                      <td class="px-6 py-4">
                        <div class="inline-flex items-center space-x-1.5 px-3 py-1 rounded-xl bg-blue-50 text-blue-950 font-bold border border-blue-200 text-xs shadow-2xs">
                          <i data-lucide="church" class="w-3.5 h-3.5 text-blue-700"></i>
                          <span>${u.paroki_name || u.kota_name || '-'}</span>

                      <td class="px-6 py-4">
                        <div class="inline-flex items-center space-x-1.5 px-3 py-1 rounded-xl bg-cyan-50 text-cyan-950 font-bold border border-cyan-200 text-xs shadow-2xs">
                          <i data-lucide="home" class="w-3.5 h-3.5 text-cyan-700"></i>
                          <span>${u.lingkungan_name || u.wilayah_name || '-'}</span>
                        </div>

                    ${state.masterSearch ? `

                        `).join('')}

                  <!-- Contextual Filter: Paroki for Wilayah -->
                  ${sub === 'wilayah' ? `

            ` : filtered.length === 0 ? `

    function renderMasterTableHeaders(sub) {
      if (sub === 'keuskupan') {
        return `
          <th class="py-4 px-5">NAMA KEUSKUPAN</th>
          <th class="py-4 px-5">KODE</th>
          <th class="py-4 px-5 text-center">TOTAL PAROKI</th>
          <th class="py-4 px-5">TANGGAL TERDAFTAR</th>
        `;
      } else if (sub === 'paroki') {
        return `
          <th class="py-4 px-5">NAMA PAROKI</th>
          <th class="py-4 px-5">KEUSKUPAN INDUK</th>
          <th class="py-4 px-5 text-center">TOTAL WILAYAH</th>
          <th class="py-4 px-5">ALAMAT LENGKAP</th>
        `;
      } else if (sub === 'wilayah') {
        return `
          <th class="py-4 px-5">NAMA WILAYAH</th>
          <th class="py-4 px-5">PAROKI INDUK</th>
          <th class="py-4 px-5">KEUSKUPAN</th>
          <th class="py-4 px-5 text-center">TOTAL LINGKUNGAN</th>
        `;
      } else if (sub === 'lingkungan') {
        return `
          <th class="py-4 px-5">NAMA LINGKUNGAN</th>
          <th class="py-4 px-5">WILAYAH INDUK</th>
          <th class="py-4 px-5">PAROKI</th>
          <th class="py-4 px-5 text-center">TOTAL UMAT</th>
        `;
      } else if (sub === 'ordo') {
        return `
          <th class="py-4 px-5">NAMA ORDO / KONGREGASI</th>
          <th class="py-4 px-5">KODE</th>
          <th class="py-4 px-5 text-center">TOTAL ROMO</th>
          <th class="py-4 px-5">ALAMAT MARKAS</th>
        `;
      } else if (sub === 'services') {
        return `
          <th class="py-4 px-5">NAMA SAKRAMEN / PELAYANAN</th>
          <th class="py-4 px-5">DESKRIPSI</th>
          <th class="py-4 px-5 text-center">URGENT DEFAULT</th>
          <th class="py-4 px-5 text-center">STATUS AKTIF</th>
          <th class="py-4 px-5 text-center">TOTAL ORDER</th>
        `;
      } else if (sub === 'roles') {
        return `
          <th class="py-4 px-5">KODE ROLE</th>
          <th class="py-4 px-5">NAMA PERAN / JENIS USER</th>
          <th class="py-4 px-5 text-center">TOTAL PENGGUNA TERHUBUNG</th>
          <th class="py-4 px-5">TIPE AKSES</th>
        `;
      } else if (sub === 'positions') {
        return `
          <th class="py-4 px-5">KODE JABATAN</th>
          <th class="py-4 px-5">NAMA JABATAN</th>
          <th class="py-4 px-5">KATEGORI STRUKTUR</th>
          <th class="py-4 px-5 text-center">STATUS PIMPINAN</th>
          <th class="py-4 px-5 text-center">TOTAL PEJABAT AKTIF</th>
        `;
      }
      return '';
    }

    function renderMasterTableRow(sub, item, idx) {
      const escapedItem = JSON.stringify(item).replace(/'/g, "&#39;");
      return `
        <tr class="hover:bg-amber-50/30 transition duration-150 group border-b border-slate-100/90">
          <td class="py-4.5 px-6 text-center">
            <span class="px-2.5 py-1 rounded-lg bg-slate-100/90 group-hover:bg-amber-100/80 text-slate-500 group-hover:text-amber-900 font-mono font-black text-[11px] border border-slate-200/60 shadow-2xs transition">
              #${String(item.id).padStart(2, '0')}
            </span>
          </td>
          ${renderMasterTableColumns(sub, item)}
          <td class="py-4.5 px-6 text-center">
            <div class="flex items-center justify-center space-x-2">
              ${sub === 'keuskupan' ? `
                <button onclick='openCreateMasterModal("paroki", { keuskupan_id: ${item.id} })'
                  class="px-2.5 py-1.5 rounded-xl bg-blue-50 hover:bg-blue-100 border border-blue-200 text-blue-950 font-black text-[11px] flex items-center space-x-1 transition shadow-2xs transform hover:-translate-y-0.5" title="Tambah Paroki Baru di Keuskupan Ini">

                  <span>+ Wilayah</span>
                </button>

              ${sub === 'wilayah' ? `

    }

            </div>
          </td>
        `;
      } else if (sub === 'paroki') {
        return `
          <td class="py-4.5 px-6">
            <div class="flex items-center space-x-3.5">
              <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-800 to-emerald-950 text-emerald-200 flex items-center justify-center flex-shrink-0 shadow-sm border border-emerald-700">
                <i data-lucide="church" class="w-4.5 h-4.5"></i>
              </div>
              <div>
                <p class="font-extrabold text-blue-950 text-xs">${item.name}</p>

              <span>${item.paroki_name || '-'}</span>

    // ── Master Modal (Create / Edit) ──
    function renderMasterModal() {
      const modal = state.activeMasterModal;
      if (!modal) return '';
      const { type, mode, data } = modal;
      const isEdit = mode === 'EDIT';

      const getTitle = () => {
        const prefix = isEdit ? 'Perbarui Data' : 'Tambah Baru';
        if (type === 'keuskupan') return `${prefix} Keuskupan`;
        if (type === 'paroki') return `${prefix} Paroki`;
        if (type === 'wilayah') return `${prefix} Wilayah`;
        if (type === 'lingkungan') return `${prefix} Lingkungan`;
        if (type === 'ordo') return `${prefix} Ordo / Kongregasi`;
        if (type === 'services') return `${prefix} Kategori Pelayanan`;
        return `${prefix} Master`;
      };

      return `
        <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto animate-fade-in">
          <div class="bg-white rounded-3xl max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-slate-200 custom-scrollbar my-8 overflow-hidden">
            <!-- Header Banner -->
            <div class="bg-gradient-to-r from-blue-950 via-slate-900 to-indigo-950 p-6 text-white relative">
              <button onclick="state.activeMasterModal = null; renderApp();"
                class="absolute top-4 right-4 p-2 rounded-full bg-white/10 hover:bg-white/20 text-white/80 hover:text-white transition">
                <i data-lucide="x" class="w-4 h-4"></i>
              </button>

              <div class="flex items-center space-x-3.5">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-amber-400 to-amber-600 text-white flex items-center justify-center shadow-lg border-2 border-white/20">
                  <i data-lucide="${isEdit ? 'edit' : 'plus'}" class="w-6 h-6"></i>
                </div>
                <div>
                  <h3 class="text-base font-black text-white">${getTitle()}</h3>
                  <p class="text-xs text-slate-300">
                    ${isEdit ? `Mengubah data ID #${data.id}` : 'Menyimpan entitas baru ke database'}
                  </p>
                </div>
              </div>
            </div>

            <!-- Form Body -->
            <div class="p-6 space-y-4 text-xs">
              ${state.masterModalError ? `
                <div class="p-3.5 rounded-2xl bg-rose-50 border border-rose-200 text-rose-800 text-xs font-bold flex items-start space-x-2 shadow-xs">
                  <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0 text-rose-600 mt-0.5"></i>
                  <span>${state.masterModalError}</span>
                </div>
              ` : ''}

              <form id="masterDataForm" onsubmit="handleSaveMaster(event)" class="space-y-4">
                ${renderMasterModalFields(type, data)}

                <div class="pt-4 border-t border-slate-200 flex items-center justify-end space-x-2.5">
                  <button type="button" onclick="state.activeMasterModal = null; renderApp();"
                    class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-extrabold text-xs transition">
                    Batal
                  </button>
                  <button type="submit" ${state.isSavingMaster ? 'disabled' : ''}
                    class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white font-black text-xs flex items-center space-x-2 shadow-md shadow-amber-500/20 transition transform hover:-translate-y-0.5 disabled:opacity-50">
                    ${state.isSavingMaster ? `
                      <span class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                      <span>Menyimpan...</span>
                    ` : `
                      <i data-lucide="save" class="w-4 h-4"></i>
                      <span>${isEdit ? 'Simpan Perubahan' : 'Tambah Sekarang'}</span>
                    `}
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      `;
    }

    function renderMasterModalFields(type, data) {
      if (type === 'keuskupan') {
        return `
          <div>
            <label class="block font-extrabold text-slate-700 mb-1.5">Nama Keuskupan *</label>
            <input type="text" id="masterNameInput" required value="${data.name || ''}" placeholder="misal: Keuskupan Agung Jakarta"
              class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-amber-500 shadow-xs" />
          </div>
          <div>
            <label class="block font-extrabold text-slate-700 mb-1.5">Kode Singkatan</label>
            <input type="text" id="masterCodeInput" value="${data.code || ''}" placeholder="misal: KAJ"

          })}

          <!-- 3. Nama Wilayah -->
          <div>
            <label class="block font-extrabold text-slate-800 mb-1.5">📍 3. Nama Wilayah Baru *</label>
            <input type="text" id="masterNameInput" required value="${data.name || ''}" placeholder="misal: Wilayah St. Fransiskus Xaverius"
              class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-amber-500 shadow-xs" />
          </div>
        `;
      } else if (type === 'lingkungan') {
        const modal = state.activeMasterModal || {};
        const parokiList = (state.modalParokiList && state.modalParokiList.length > 0) ? state.modalParokiList : (state.paroki || []);
        const wilayahList = (state.modalWilayahList && state.modalWilayahList.length > 0) ? state.modalWilayahList : (state.wilayah || []);
        const selectedWilayahId = data.wilayah_id || data.wilayahId;
        return `
          <!-- 1. Filter Keuskupan -->
          <div class="p-3 bg-slate-50 border border-slate-200 rounded-2xl space-y-1.5">
            ${renderCustomCombobox({
              id: 'modalLingkunganFilterKeuskupanId',
              name: 'modalLingkunganKeuskupan',
              label: '1. Filter Keuskupan (Opsional)',
              icon: '🏛️',
              badgeText: `${(state.keuskupan || []).length} Keuskupan`,
              placeholder: '-- Semua Keuskupan --',
              searchPlaceholder: '🔍 Cari Keuskupan...',
              options: (state.keuskupan || []).map(k => ({ id: k.id, name: k.name })),

    // ── Toast Notifications System ──
    function showToast(message, type = 'success', title = '', duration = 4000) {
      const id = 'toast_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
      const defaultTitles = {
        success: 'Aksi Berhasil! ✨',
        error: 'Terjadi Kesalahan!',
        warning: 'Pemberitahuan Penting',
        info: 'Informasi Sistem'
      };
      
      const toastObj = {
        id,
        message,
        type,
        title: title || defaultTitles[type] || 'Notifikasi',
        timestamp: Date.now()
      };

      state.toasts.push(toastObj);
      renderApp();

      if (duration > 0) {
        setTimeout(() => {
          dismissToast(id);
        }, duration);
      }
    }

    function dismissToast(id) {
      const idx = state.toasts.findIndex(t => t.id === id);
      if (idx !== -1) {
        state.toasts.splice(idx, 1);
        renderApp();
      }
    }

    function renderToastsContainer() {
      if (!state.toasts || state.toasts.length === 0) return '';

      return `
        <div class="fixed top-6 right-6 z-[99999] flex flex-col space-y-3 pointer-events-none max-w-sm w-full animate-fade-in">
          ${state.toasts.map(toast => {
            const isSuccess = toast.type === 'success';
            const isError = toast.type === 'error';
            const isWarning = toast.type === 'warning';
            
            const borderBg = isSuccess ? 'border-emerald-200/90 bg-gradient-to-r from-emerald-50/95 via-white to-white' :
              isError ? 'border-rose-200/90 bg-gradient-to-r from-rose-50/95 via-white to-white' :
              isWarning ? 'border-amber-200/90 bg-gradient-to-r from-amber-50/95 via-white to-white' :
              'border-blue-200/90 bg-gradient-to-r from-blue-50/95 via-white to-white';

            const iconBg = isSuccess ? 'bg-gradient-to-br from-emerald-500 to-emerald-600 text-white shadow-md shadow-emerald-500/30' :
              isError ? 'bg-gradient-to-br from-rose-500 to-rose-600 text-white shadow-md shadow-rose-500/30' :
              isWarning ? 'bg-gradient-to-br from-amber-500 to-amber-600 text-white shadow-md shadow-amber-500/30' :
              'bg-gradient-to-br from-blue-600 to-blue-700 text-white shadow-md shadow-blue-500/30';

            const iconName = isSuccess ? 'check-circle-2' : isError ? 'alert-octagon' : isWarning ? 'alert-triangle' : 'info';
            const titleColor = isSuccess ? 'text-emerald-950' : isError ? 'text-rose-950' : isWarning ? 'text-amber-950' : 'text-blue-950';

            return `
              <div class="pointer-events-auto bg-white rounded-2xl shadow-2xl ${borderBg} border p-4 flex items-start space-x-3.5 transform transition-all duration-300 shadow-xl shadow-slate-900/10 ring-1 ring-black/5">
                <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 ${iconBg}">
                  <i data-lucide="${iconName}" class="w-5 h-5"></i>
                </div>
                <div class="flex-1 min-w-0 pt-0.5">
                  <h4 class="font-black text-xs ${titleColor} tracking-tight">${toast.title}</h4>
                  <p class="text-xs font-semibold text-slate-700 mt-0.5 leading-relaxed">${toast.message}</p>
                </div>
                <button onclick="dismissToast('${toast.id}')" class="text-slate-400 hover:text-slate-700 p-1 rounded-lg hover:bg-slate-100 transition flex-shrink-0" title="Tutup">
                  <i data-lucide="x" class="w-3.5 h-3.5"></i>
                </button>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function saveAgentationPin(e) {
      e.preventDefault();
      const p = state.agentation.pendingPin;
      if (!p) return;

      const note = document.getElementById('pinNoteInput').value.trim();
      const category = document.getElementById('pinCategoryInput').value;

      state.agentation.annotations.push({
        id: 'pin_' + Date.now(),
        x: p.x,
        y: p.y,
        pageTab: state.currentTab,
        elementSelector: p.selector,
        elementTag: p.tag,
        elementText: p.text,
        category,
        note,
        createdAt: new Date().toISOString(),
        resolved: false,
      });

      localStorage.setItem('catu_agentation_annotations', JSON.stringify(state.agentation.annotations));
      state.agentation.pendingPin = null;
      renderApp();
    }

    function copyAgentationPromptToClipboard() {
      const list = state.agentation.annotations.filter(a => !a.resolved);
      if (list.length === 0) {
        showToast('Belum ada catatan revisi Agentation yang ditambahkan.', 'warning', 'Catatan Kosong');
        return;
      }

      let prompt = `### 🎯 DAFTAR REVISI UI / DESAIN AGENTATION (${state.currentTab.toUpperCase()}):\n\n`;
      list.forEach((a, i) => {
        prompt += `${i + 1}. [${a.category}] Elemen: \`${a.elementSelector}\`\n   - Catatan: "${a.note}"\n   - Tag: <${a.elementTag}>\n\n`;
      });
      prompt += `Tolong revisi dan perbaiki elemen-elemen UI di atas sesuai catatan tepat sasaran.`;

      navigator.clipboard.writeText(prompt).then(() => {
        state.agentation.annotations = [];
        localStorage.setItem('catu_agentation_annotations', JSON.stringify([]));
        state.agentation.enabled = false;
        state.agentation.expanded = false;
        
        const box = document.getElementById('agentation-inspector-box');
        if (box) box.style.display = 'none';

        renderApp();
        showToast('Seluruh catatan revisi Agentation berhasil disalin ke clipboard & pin dibersihkan! Silakan Paste prompt ke chat AI.', 'success', 'Tersalin ke Clipboard! 📋');
      }).catch(() => {
        state.agentation.annotations = [];
        localStorage.setItem('catu_agentation_annotations', JSON.stringify([]));
        renderApp();
        showToast('Pin revisi telah dibersihkan.', 'info', 'Pin Dibersihkan');
      });
    }

    // ── Mouse Listeners for Agentation (Popup-Compatible) ──
    window.addEventListener('mousemove', (e) => {
      if (!state.agentation.enabled) {
        const box = document.getElementById('agentation-inspector-box');
        if (box) box.style.display = 'none';
        return;
      }

      const target = document.elementFromPoint(e.clientX, e.clientY);
      if (!target || target.closest('[data-feedback-toolbar]') || target.closest('.agentation-pin') || target.closest('[data-agentation-dialog]') || target.id === 'agentation-inspector-box') {
        return;
      }

      const rect = target.getBoundingClientRect();
      const box = document.getElementById('agentation-inspector-box');
      const label = document.getElementById('agentation-inspector-label');
      if (box && label) {
        box.style.display = 'block';
        box.style.left = `${rect.left}px`;
        box.style.top = `${rect.top}px`;
        box.style.width = `${rect.width}px`;
        box.style.height = `${rect.height}px`;

        const tag = target.tagName.toLowerCase();
        const idStr = target.id ? ('#' + target.id) : '';
        const cls = target.className && typeof target.className === 'string' ? ('.' + target.className.trim().split(' ')[0]) : '';
        label.textContent = `${tag}${idStr || cls} (${Math.round(rect.width)}x${Math.round(rect.height)})`;
      }
    });

    window.addEventListener('click', (e) => {
      if (!state.agentation.enabled) return;

      const target = document.elementFromPoint(e.clientX, e.clientY);
      if (!target || target.closest('[data-feedback-toolbar]') || target.closest('.agentation-pin') || target.closest('[data-agentation-dialog]') || target.id === 'agentation-inspector-box') {
        return;
      }

      e.preventDefault();
      e.stopPropagation();

      const modalParent = target.closest('.fixed:not([data-agentation-dialog])');
      let modalPrefix = '';
      if (modalParent) {
        const modalTitle = modalParent.querySelector('h3, h4')?.innerText?.trim() || 'Popup Modal';
        modalPrefix = `[Popup: ${modalTitle}] > `;
      }

      let path = [];
      let el = target;
      while (el && el.nodeType === Node.ELEMENT_NODE && path.length < 4) {
        if (el === modalParent) break;
        let sel = el.nodeName.toLowerCase();
        if (el.id) {
          sel += '#' + el.id;
          path.unshift(sel);
          break;
        } else {
          let sib = el, nth = 1;
          while (sib = sib.previousElementSibling) {
            if (sib.nodeName.toLowerCase() == sel) nth++;
          }
          if (nth != 1) sel += ":nth-of-type("+nth+")";
        }
        path.unshift(sel);
        el = el.parentNode;
      }

      const fullSelector = modalPrefix + (path.join(' > ') || target.tagName.toLowerCase());

      state.agentation.pendingPin = {
        x: e.clientX,
        y: e.clientY,
        selector: fullSelector,
        tag: target.tagName.toLowerCase(),
        text: (target.value || target.placeholder || target.innerText || target.textContent || '').trim().substring(0, 100),
      };

      const box = document.getElementById('agentation-inspector-box');
      if (box) box.style.display = 'none';

      renderApp();
    }, true);

    // ══════════════════════════════════════════════════════════════════════════
    // SEARCHABLE COMBOBOX COMPONENT (SEARCH INSIDE DROPDOWN PANEL)
    // ══════════════════════════════════════════════════════════════════════════
    function renderCustomCombobox({
      id,
      name,
      label,
      badgeText,
      placeholder = '-- Pilih --',
      searchPlaceholder = 'Ketik untuk mencari...',
      options = [],
      selectedValue = '',
      onSelectCallback = '',
      onClearCallback = '',
      disabled = false,
      icon = ''
    }) {
      const isOpen = state.openCombobox === name;
      const searchVal = (state.comboboxFilters && state.comboboxFilters[name]) ? state.comboboxFilters[name].toLowerCase().trim() : '';
      
      const selectedItem = options.find(o => String(o.id) === String(selectedValue));
      const filteredOptions = options.filter(o => {
        if (!searchVal) return true;
        const nameMatch = o.name && o.name.toLowerCase().includes(searchVal);
        const codeMatch = o.code && o.code.toLowerCase().includes(searchVal);
        const extraMatch = o.extra && o.extra.toLowerCase().includes(searchVal);
        return nameMatch || codeMatch || extraMatch;
      });

      const activeBorder = isOpen ? 'ring-2 ring-amber-500 border-amber-500' : 'border-slate-200 hover:border-slate-300';

      return `
        <div class="custom-combobox-container relative">
          ${label ? `
            <div class="flex items-center justify-between mb-1.5">
              <label class="block font-extrabold text-slate-700 text-[11px] flex items-center">
                ${icon ? `<span class="mr-1">${icon}</span>` : ''}
                ${label}
              </label>
              ${badgeText ? `<span class="text-[10px] text-slate-400 font-bold">${badgeText}</span>` : ''}
            </div>
          ` : ''}

          <!-- Hidden Input for Form Submission & ID querying -->
          <input type="hidden" id="${id}" value="${selectedValue || ''}" />

          <!-- Combobox Trigger Box -->
          <div class="relative">
            <button type="button" 
              onclick="${disabled ? '' : `toggleCustomCombobox('${name}')`}"
              ${disabled ? 'disabled' : ''}
              class="w-full px-3.5 py-2.5 bg-white border ${activeBorder} rounded-xl font-bold text-xs text-left flex items-center justify-between shadow-2xs transition ${disabled ? 'opacity-60 bg-slate-100 cursor-not-allowed text-slate-400' : 'text-slate-900 cursor-pointer'}">
              <span class="truncate ${selectedItem ? 'text-slate-900 font-bold' : 'text-slate-400 font-normal'}">
                ${selectedItem ? (selectedItem.name + (selectedItem.code ? ` (${selectedItem.code})` : '')) : placeholder}
              </span>
              <div class="flex items-center space-x-1.5 flex-shrink-0 ml-2">
                ${selectedItem && onClearCallback && !disabled ? `
                  <span onclick="event.stopPropagation(); ${onClearCallback}();" 
                    title="Hapus Pilihan"
                    class="p-0.5 rounded-full hover:bg-slate-200 text-slate-400 hover:text-slate-700 transition">
                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                  </span>
                ` : ''}
                <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 transition transform ${isOpen ? 'rotate-180 text-amber-600' : ''}"></i>
              </div>
            </button>
          </div>

          <!-- Dropdown Panel (Contains Search INSIDE & Scrollable Options) -->
          ${isOpen && !disabled ? `
            <div class="absolute left-0 right-0 top-full mt-1.5 z-50 bg-white border border-slate-200 rounded-2xl shadow-xl p-2.5 space-y-2 animate-fade-in custom-scrollbar">
              <!-- Search Input INSIDE the combobox dropdown -->
              <div class="relative">
                <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="comboboxSearch_${name}" placeholder="${searchPlaceholder}"
                  value="${state.comboboxFilters?.[name] || ''}"
                  oninput="onComboboxInnerSearch('${name}', this.value)"
                  class="w-full pl-8 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-900 focus:outline-none focus:bg-white focus:ring-2 focus:ring-amber-500 shadow-2xs" />
              </div>

              <!-- Options List Inside Combobox -->
              <div class="max-h-48 overflow-y-auto space-y-0.5 custom-scrollbar">
                ${filteredOptions.map(opt => {
                  const isSelected = String(selectedValue) === String(opt.id);
                  return `
                    <button type="button" 
                      onclick="${onSelectCallback}('${opt.id}')"
                      class="w-full text-left px-3 py-2 rounded-xl text-xs transition flex items-center justify-between ${isSelected ? 'bg-amber-50 text-amber-950 font-black' : 'text-slate-700 font-semibold hover:bg-slate-100 hover:text-slate-900'}">
                      <div class="truncate">
                        <span>${opt.name}</span>
                        ${opt.subtext ? `<span class="text-[10px] text-slate-400 block">${opt.subtext}</span>` : ''}
                      </div>
                      ${isSelected ? `<i data-lucide="check" class="w-3.5 h-3.5 text-amber-600 flex-shrink-0 ml-1.5"></i>` : ''}
                    </button>
                  `;
                }).join('')}

                ${filteredOptions.length === 0 ? `
                  <div class="p-3 text-center text-xs text-slate-400 font-medium">
                    Tidak ada hasil ditemukan
                  </div>
                ` : ''}
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    async function loadDashboardData() {
      try {
        const [anRes, ordRes, usrRes, provRes, kkRes, kRes, pRes, oRes, scRes, rRes, posRes] = await Promise.all([
          fetch(`${API_BASE}/auth/admin/analytics`),
          fetch(`${API_BASE}/orders`),
          fetch(`${API_BASE}/auth/admin/users`),
          fetch(`${API_BASE}/auth/provinsi`),
          fetch(`${API_BASE}/auth/kabupaten-kota`),
          fetch(`${API_BASE}/master/keuskupan`),
          fetch(`${API_BASE}/master/paroki`),
          fetch(`${API_BASE}/master/ordo`),
          fetch(`${API_BASE}/master/service-categories`),
          fetch(`${API_BASE}/master/roles`),
          fetch(`${API_BASE}/master/positions`),
        ]);

        state.analytics = await anRes.json();
        const ordData = await ordRes.json();
        state.orders = Array.isArray(ordData) ? ordData : (ordData.orders || []);
        const usrData = await usrRes.json();
        state.users = usrData.users || (Array.isArray(usrData) ? usrData : []);
        state.provinsi = await provRes.json();
        state.kabupatenKota = await kkRes.json();
        state.keuskupan = await kRes.json();
        state.paroki = await pRes.json();
        state.ordo = await oRes.json();
        state.serviceCategories = await scRes.json();
        state.roles = await rRes.json();
        state.positions = await posRes.json();

        // Also fetch initial master list for active subtab
        await loadMasterData(state.masterSubTab || 'paroki');
        renderApp();
      } catch (err) {
        console.error('Error loading dashboard data:', err);
      }
    }

    // ── Master Data API Handlers ──
    async function setMasterSubTab(subTab) {
      state.masterSubTab = subTab;
      state.masterSearch = '';
      await loadMasterData(subTab);
    }

    async function loadMasterData(subTab) {
      if (subTab) state.masterSubTab = subTab;
      state.isMasterLoading = true;
      renderApp();

      try {
        const tab = state.masterSubTab;
        let url = '';
        if (tab === 'keuskupan') {
          url = `${API_BASE}/master/keuskupan`;
        } else if (tab === 'paroki') {
          url = `${API_BASE}/master/paroki${state.masterFilterKeuskupanId ? '?keuskupanId=' + state.masterFilterKeuskupanId : ''}`;
        } else if (tab === 'wilayah') {
          url = `${API_BASE}/master/wilayah${state.masterFilterParokiId ? '?parokiId=' + state.masterFilterParokiId : ''}`;

    async function handleSaveMaster(event) {
      if (event) event.preventDefault();
      const modal = state.activeMasterModal;
      if (!modal) return;

      const { type, mode, data } = modal;
      let endpoint = '';
      let method = mode === 'CREATE' ? 'POST' : 'PUT';
      let payload = {};

      try {
        // 1. Read DOM inputs FIRST before any renderApp call
        if (type === 'keuskupan') {
          endpoint = mode === 'CREATE' ? `${API_BASE}/master/keuskupan` : `${API_BASE}/master/keuskupan/${data.id}`;
          const nameVal = document.getElementById('masterNameInput')?.value?.trim();
          const codeVal = document.getElementById('masterCodeInput')?.value?.trim();
          if (!nameVal) throw new Error('Nama Keuskupan wajib diisi');
          payload = { name: nameVal };
          if (codeVal) payload.code = codeVal;
          modal.data.name = nameVal;
          modal.data.code = codeVal;
        } else if (type === 'paroki') {
          endpoint = mode === 'CREATE' ? `${API_BASE}/master/paroki` : `${API_BASE}/master/paroki/${data.id}`;
          const keuskupanIdVal = parseInt(document.getElementById('masterKeuskupanIdInput')?.value);
          const nameVal = document.getElementById('masterNameInput')?.value?.trim();
          const addressVal = document.getElementById('masterAddressInput')?.value?.trim();
          if (!keuskupanIdVal || isNaN(keuskupanIdVal)) throw new Error('Silakan pilih Keuskupan terlebih dahulu');
          if (!nameVal) throw new Error('Nama Paroki wajib diisi');
          payload = { keuskupanId: keuskupanIdVal, name: nameVal };
          if (addressVal) payload.address = addressVal;
          modal.data.keuskupan_id = keuskupanIdVal;
          modal.data.name = nameVal;
          modal.data.address = addressVal;
        } else if (type === 'wilayah') {
          endpoint = mode === 'CREATE' ? `${API_BASE}/master/wilayah` : `${API_BASE}/master/wilayah/${data.id}`;
          const parokiIdVal = parseInt(document.getElementById('masterParokiIdInput')?.value);
          const nameVal = document.getElementById('masterNameInput')?.value?.trim();
          if (!parokiIdVal || isNaN(parokiIdVal)) throw new Error('Silakan pilih Paroki terlebih dahulu');
          if (!nameVal) throw new Error('Nama Wilayah wajib diisi');
          payload = { parokiId: parokiIdVal, name: nameVal };
          modal.data.paroki_id = parokiIdVal;
          modal.data.name = nameVal;
        } else if (type === 'lingkungan') {
          endpoint = mode === 'CREATE' ? `${API_BASE}/master/lingkungan` : `${API_BASE}/master/lingkungan/${data.id}`;
          const wilayahIdVal = parseInt(document.getElementById('masterWilayahIdInput')?.value);
          const nameVal = document.getElementById('masterNameInput')?.value?.trim();
          if (!wilayahIdVal || isNaN(wilayahIdVal)) throw new Error('Silakan pilih Wilayah terlebih dahulu');
          if (!nameVal) throw new Error('Nama Lingkungan wajib diisi');
          payload = { wilayahId: wilayahIdVal, name: nameVal };
          modal.data.wilayah_id = wilayahIdVal;
          modal.data.name = nameVal;
        } else if (type === 'ordo') {
          endpoint = mode === 'CREATE' ? `${API_BASE}/master/ordo` : `${API_BASE}/master/ordo/${data.id}`;
          const nameVal = document.getElementById('masterNameInput')?.value?.trim();
          const codeVal = document.getElementById('masterCodeInput')?.value?.trim();
          const addressVal = document.getElementById('masterAddressInput')?.value?.trim();
          if (!nameVal) throw new Error('Nama Ordo / Kongregasi wajib diisi');
          payload = { name: nameVal };
          if (codeVal) payload.code = codeVal;
          if (addressVal) payload.address = addressVal;
          modal.data.name = nameVal;
          modal.data.code = codeVal;
          modal.data.address = addressVal;
        } else if (type === 'services') {
          endpoint = mode === 'CREATE' ? `${API_BASE}/master/service-categories` : `${API_BASE}/master/service-categories/${data.id}`;
          const nameVal = document.getElementById('masterNameInput')?.value?.trim();
          const descVal = document.getElementById('masterDescInput')?.value?.trim();
          const isUrgent = document.getElementById('masterIsUrgentInput')?.checked || false;
          const isActive = document.getElementById('masterIsActiveInput')?.checked !== false;
          if (!nameVal) throw new Error('Nama Sakramen / Pelayanan wajib diisi');
          payload = {
            name: nameVal,
            isUrgentByDefault: isUrgent,
            isActive: isActive
          };
          if (descVal) payload.description = descVal;
          modal.data.name = nameVal;
          modal.data.description = descVal;
          modal.data.is_urgent_by_default = isUrgent;
          modal.data.is_active = isActive;
        } else if (type === 'roles') {
          endpoint = mode === 'CREATE' ? `${API_BASE}/master/roles` : `${API_BASE}/master/roles/${data.id}`;
          const codeVal = document.getElementById('masterCodeInput')?.value?.trim().toUpperCase().replace(/\s+/g, '_');
          const nameVal = document.getElementById('masterNameInput')?.value?.trim();
          if (!codeVal) throw new Error('Kode Role wajib diisi');
          if (!nameVal) throw new Error('Nama Jenis Role wajib diisi');
          payload = { code: codeVal, name: nameVal };
          modal.data.code = codeVal;
          modal.data.name = nameVal;
        } else if (type === 'positions') {
          endpoint = mode === 'CREATE' ? `${API_BASE}/master/positions` : `${API_BASE}/master/positions/${data.id}`;
          const categoryVal = document.getElementById('masterCategoryInput')?.value;
          const codeVal = document.getElementById('masterCodeInput')?.value?.trim().toUpperCase().replace(/\s+/g, '_');
          const nameVal = document.getElementById('masterNameInput')?.value?.trim();
          const isLeadVal = document.getElementById('masterIsLeadInput')?.checked || false;
          if (!categoryVal) throw new Error('Kategori Struktur Jabatan wajib dipilih');
          if (!codeVal) throw new Error('Kode Jabatan wajib diisi');
          if (!nameVal) throw new Error('Nama Jabatan wajib diisi');
          payload = { category: categoryVal, code: codeVal, name: nameVal, isLead: isLeadVal };
          modal.data.category = categoryVal;
          modal.data.code = codeVal;
          modal.data.name = nameVal;
          modal.data.is_lead = isLeadVal;
        }

        // 2. Now set loading state and render spinner
        state.isSavingMaster = true;
        state.masterModalError = '';
        renderApp();

        // 3. Send request to backend
        const res = await fetch(endpoint, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await res.json();
        if (!res.ok) {
          const errMsg = Array.isArray(result.message) ? result.message.join(', ') : (result.message || 'Gagal menyimpan data.');
          throw new Error(errMsg);
        }

        state.activeMasterModal = null;
        showToast(`Data ${getEntityLabel(type)} "${modal.data.name || ''}" berhasil disimpan ke sistem!`, 'success', mode === 'CREATE' ? 'Data Berhasil Ditambahkan! 🎉' : 'Perubahan Berhasil Disimpan! ✨');
        await loadMasterData(state.masterSubTab);

        // Also refresh global lookups
        try {
          const [kRes, pRes, oRes, scRes, rRes, posRes] = await Promise.all([
            fetch(`${API_BASE}/master/keuskupan`),
            fetch(`${API_BASE}/master/paroki`),
            fetch(`${API_BASE}/master/ordo`),
            fetch(`${API_BASE}/master/service-categories`),
            fetch(`${API_BASE}/master/roles`),
            fetch(`${API_BASE}/master/positions`),
          ]);
          state.keuskupan = await kRes.json();
          state.paroki = await pRes.json();
          state.ordo = await oRes.json();
          state.serviceCategories = await scRes.json();
          state.roles = await rRes.json();
          state.positions = await posRes.json();
        } catch (_) {}
        renderApp();
      } catch (err) {
        state.masterModalError = err.message || 'Terjadi kesalahan sistem.';
        renderApp();
      } finally {
        state.isSavingMaster = false;
        renderApp();
      }
    }

    async function executeDeleteMaster() {
      const del = state.deleteConfirmModal;
      if (!del) return;

      let endpoint = '';
      if (del.type === 'keuskupan') endpoint = `${API_BASE}/master/keuskupan/${del.id}`;
      else if (del.type === 'paroki') endpoint = `${API_BASE}/master/paroki/${del.id}`;
      else if (del.type === 'wilayah') endpoint = `${API_BASE}/master/wilayah/${del.id}`;
      else if (del.type === 'lingkungan') endpoint = `${API_BASE}/master/lingkungan/${del.id}`;
      else if (del.type === 'ordo') endpoint = `${API_BASE}/master/ordo/${del.id}`;
      else if (del.type === 'services') endpoint = `${API_BASE}/master/service-categories/${del.id}`;
      else if (del.type === 'roles') endpoint = `${API_BASE}/master/roles/${del.id}`;
      else if (del.type === 'positions') endpoint = `${API_BASE}/master/positions/${del.id}`;

      try {
        const res = await fetch(endpoint, { method: 'DELETE' });
        const result = await res.json();
        if (!res.ok) {
          throw new Error(result.message || 'Gagal menghapus data.');
        }

        const deletedName = del.name;
        state.deleteConfirmModal = null;
        showToast(`Data "${deletedName}" berhasil dihapus dari database.`, 'success', 'Data Terhapus! 🗑️');
        await loadMasterData(state.masterSubTab);
        renderApp();
      } catch (err) {
        del.errorMessage = err.message || 'Terjadi kesalahan saat menghapus data.';
        renderApp();
      }
    }
