<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CATU Admin Portal - Sistem Informasi Pelayanan Gereja</title>
  <link rel="icon" type="image/png" href="assets/images/logoCatu.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .church-bg {
      background-image: linear-gradient(135deg, rgba(10, 17, 40, 0.92), rgba(15, 23, 42, 0.88), rgba(30, 41, 59, 0.94)), url('assets/images/church_1.jpg');
      background-size: cover;
      background-position: center;
    }
    .cross-bg {
      background-image: linear-gradient(rgba(248, 250, 252, 0.96), rgba(241, 245, 249, 0.96)), url('assets/images/cross_banner.jpg');
      background-size: cover;
      background-position: center;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    
    /* Agentation Inspector Highlight Box */
    #agentation-inspector-box {
      position: fixed;
      pointer-events: none;
      border: 2px dashed #f59e0b;
      background-color: rgba(245, 158, 11, 0.15);
      border-radius: 6px;
      z-index: 99990;
      transition: all 0.05s ease;
      display: none;
    }
    #agentation-inspector-label {
      position: absolute;
      top: -24px;
      left: 0;
      background: #0f172a;
      color: #f59e0b;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .agentation-pin {
      position: absolute;
      z-index: 99995;
      transform: translate(-50%, -50%);
      cursor: pointer;
      animation: pinPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes pinPop {
      0% { transform: translate(-50%, -50%) scale(0); }
      80% { transform: translate(-50%, -50%) scale(1.15); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }
  </style>
</head>
<body class="h-full text-slate-800 antialiased">
  <div id="app" class="h-full"></div>

  <!-- Agentation Inspector Highlight Box -->
  <div id="agentation-inspector-box">
    <div id="agentation-inspector-label">element</div>
  </div>

  <!-- Agentation Pins Layer Container -->
  <div id="agentation-pins-layer" class="fixed inset-0 pointer-events-none z-[99992]"></div>

  <script>
    // Config & State
    const API_BASE = `http://${window.location.hostname}:3005`;
    let rawStoredUser = null;
    try {
      rawStoredUser = JSON.parse(localStorage.getItem('catu_admin_user') || 'null');
    } catch(e) { rawStoredUser = null; }

    // Load persisted Agentation annotations
    let rawStoredAnnotations = [];
    try {
      rawStoredAnnotations = JSON.parse(localStorage.getItem('catu_agentation_annotations') || '[]');
    } catch(e) { rawStoredAnnotations = []; }

    const state = {
      currentUser: (rawStoredUser && (rawStoredUser.roleCode === 'ADMIN' || rawStoredUser.role_code === 'ADMIN')) ? rawStoredUser : null,
      token: localStorage.getItem('catu_admin_token') || '',
      currentTab: 'overview',
      isSidebarOpen: localStorage.getItem('catu_sidebar_open') !== 'false',
      analytics: null,
      orders: [],
      users: [],
      provinsi: [],
      kabupatenKota: [],
      keuskupan: [],
      paroki: [],
      wilayah: [],
      lingkungan: [],
      ordo: [],
      masterSubTab: 'paroki',
      masterSearch: '',
      masterFilterKeuskupanId: '',
      masterFilterParokiId: '',
      masterFilterWilayahId: '',
      serviceCategories: [],
      masterDataList: [],
      isMasterLoading: false,
      activeMasterModal: null,
      modalParokiList: [],
      modalWilayahList: [],
      isSavingMaster: false,
      masterModalError: '',
      deleteConfirmModal: null,
      
      // Searches
      orderSearch: '',
      orderStatusFilter: 'ALL',
      orderCategoryFilter: 'ALL',
      
      umatSearch: '',
      pengurusSearch: '',
      romoParokiSearch: '',
      romoOrdoSearch: '',
      approvalsSearch: '',

      isLoading: false,
      loginLoading: false,
      loginError: '',
      testResults: null,
      isRunningTests: false,
      
      // Modals
      activeChatOrder: null,
      activeOrderDetail: null,
      activeUserProfile: null,
      activeEditUser: null,
      isSavingProfile: false,
      editFormError: '',

      // 🎯 Agentation Visual Feedback System State
      agentation: {
        enabled: false,
        expanded: false,
        showDrawer: false,
        annotations: rawStoredAnnotations,
        pendingPin: null,
        activePinId: null,
        selectedCategory: 'BUG',
      }
    };

    // Render Main App Dispatcher
    function renderApp() {
      const app = document.getElementById('app');
      if (!state.currentUser || (state.currentUser.roleCode !== 'ADMIN' && state.currentUser.role_code !== 'ADMIN')) {
        app.innerHTML = renderLoginPage();
        attachLoginListeners();
      } else {
        app.innerHTML = renderDashboardLayout();
        attachDashboardListeners();
      }
      try {
        lucide.createIcons();
      } catch(e) {}
      renderAgentationPins();
    }

    // ══════════════════════════════════════════════════════════════════════════
    // 1. LOGIN PAGE
    // ══════════════════════════════════════════════════════════════════════════
    function renderLoginPage() {
      return `
        <div class="min-h-full flex flex-col lg:flex-row">
          <div class="church-bg lg:w-[54%] p-8 lg:p-14 flex flex-col justify-between text-white relative">
            <div>
              <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3.5">
                  <div class="w-12 h-12 rounded-xl bg-white p-1.5 shadow-lg border-2 border-amber-500 flex items-center justify-center">
                    <img src="assets/images/logoCatu.png" alt="CATU Logo" class="h-full object-contain" />
                  </div>
                  <div>
                    <h1 class="text-xl font-extrabold tracking-wider text-white">CATU WEB PORTAL</h1>
                    <p class="text-[11px] font-bold text-amber-400 tracking-wider">CARI & BANTU PELAYANAN GEREJA</p>
                  </div>
                </div>
                <div class="hidden sm:inline-flex items-center px-3 py-1 rounded-full bg-white/10 border border-white/20 text-xs font-semibold text-white/90">
                  <i data-lucide="shield-alert" class="w-3.5 h-3.5 mr-1.5 text-amber-400"></i>
                  Portal Khusus Administrator
                </div>
              </div>
            </div>

            <div class="my-12 lg:my-0 max-w-xl">
              <h2 class="text-3xl lg:text-4xl font-extrabold leading-tight tracking-tight text-white mb-4">
                Sistem Informasi & Manajemen<br/><span class="text-amber-400">Pelayanan Umat Katolik</span>
              </h2>
              <p class="text-slate-300 text-sm lg:text-base leading-relaxed mb-8">
                Platform terpusat untuk monitoring pelayanan Misa Kedukaan, Sakramen Perminyakan, verifikasi pendaftaran berjenjang, dan koordinasi lintas paroki.
              </p>

              <div class="space-y-4">
                <div class="flex items-start space-x-3.5 p-3.5 rounded-xl bg-white/5 border border-white/10 backdrop-blur-sm">
                  <div class="p-2 rounded-lg bg-amber-500/20 text-amber-400">
                    <i data-lucide="church" class="w-5 h-5"></i>
                  </div>
                  <div>
                    <h3 class="text-sm font-bold text-white">Integrasi Lintas Paroki & Ordo</h3>
                    <p class="text-xs text-slate-300">Pengelolaan permohonan pelayanan sakramental secara transparan dan terstruktur.</p>
                  </div>
                </div>

                <div class="flex items-start space-x-3.5 p-3.5 rounded-xl bg-white/5 border border-white/10 backdrop-blur-sm">
                  <div class="p-2 rounded-lg bg-emerald-500/20 text-emerald-400">
                    <i data-lucide="user-check" class="w-5 h-5"></i>
                  </div>
                  <div>
                    <h3 class="text-sm font-bold text-white">Persetujuan Akun Berjenjang</h3>
                    <p class="text-xs text-slate-300">Verifikasi pendaftaran Umat, Romo, dan Pengurus Lingkungan dengan satu klik.</p>
                  </div>
                </div>
              </div>
            </div>

            <div class="flex items-center text-xs text-slate-400 space-x-2 pt-6 border-t border-white/10">
              <i data-lucide="shield-check" class="w-4 h-4 text-emerald-400"></i>
              <span>CATU Platform v2.5.0 • Powered by NestJS & PostgreSQL 16</span>
            </div>
          </div>

          <div class="cross-bg lg:w-[46%] p-8 lg:p-14 flex items-center justify-center">
            <div class="w-full max-w-md bg-white rounded-3xl p-8 lg:p-10 shadow-2xl border border-slate-200">
              <div class="text-center mb-8">
                <img src="assets/images/logoCatu.png" alt="CATU Logo" class="h-16 mx-auto mb-4 object-contain" />
                <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Masuk Portal Admin</h2>
                <p class="text-xs text-slate-500 mt-1">Masukkan kredensial Administrator untuk mengakses dashboard.</p>
              </div>

              ${state.loginError ? `
                <div class="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs font-semibold flex items-start space-x-2.5">
                  <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0 text-red-600"></i>
                  <span>${state.loginError}</span>
                </div>
              ` : ''}

              <form id="loginForm" class="space-y-4">
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1.5">Nomor WhatsApp / HP</label>
                  <div class="relative rounded-xl shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                      <span class="text-sm mr-1">🇮🇩</span>
                      <span class="text-xs font-bold text-blue-900 border-r border-slate-300 pr-2">+62</span>
                    </div>
                    <input type="tel" id="phoneInput" required placeholder="89999999999" value="89999999999"
                      class="block w-full pl-16 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-900 focus:bg-white" />
                  </div>
                </div>

                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1.5">Kata Sandi</label>
                  <div class="relative rounded-xl shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                      <i data-lucide="lock" class="w-4 h-4 text-blue-900"></i>
                    </div>
                    <input type="password" id="passwordInput" required placeholder="••••••••" value="password123"
                      class="block w-full pl-10 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-900 focus:bg-white" />
                    <button type="button" id="togglePasswordBtn" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600">
                      <i data-lucide="eye" class="w-4 h-4"></i>
                    </button>
                  </div>
                </div>

                <div class="pt-2">
                  <button type="submit" id="submitBtn" ${state.loginLoading ? 'disabled' : ''}
                    class="w-full py-3.5 px-4 bg-blue-950 hover:bg-blue-900 text-white text-sm font-bold rounded-xl shadow-lg shadow-blue-950/20 flex items-center justify-center space-x-2 transition duration-200 disabled:opacity-50">
                    ${state.loginLoading ? `
                      <span class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                      <span>Memverifikasi...</span>
                    ` : `
                      <i data-lucide="log-in" class="w-4 h-4"></i>
                      <span>MASUK KE PORTAL ADMIN</span>
                    `}
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      `;
    }

    function attachLoginListeners() {
      const toggleBtn = document.getElementById('togglePasswordBtn');
      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          const pass = document.getElementById('passwordInput');
          pass.type = pass.type === 'password' ? 'text' : 'password';
        });
      }

      const form = document.getElementById('loginForm');
      if (form) {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const phone = document.getElementById('phoneInput').value.trim();
          const password = document.getElementById('passwordInput').value.trim();

          state.loginLoading = true;
          state.loginError = '';
          renderApp();

          try {
            const res = await fetch(`${API_BASE}/auth/admin/login`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ phoneNumber: phone, password }),
            });
            const data = await res.json();

            const isSuccess = (res.ok || res.status === 200 || data.statusCode === 200) &&
                              data.user && (data.user.roleCode === 'ADMIN' || data.user.role_code === 'ADMIN');

            if (isSuccess) {
              state.currentUser = data.user;
              state.token = data.accessToken || '';
              localStorage.setItem('catu_admin_user', JSON.stringify(data.user));
              localStorage.setItem('catu_admin_token', data.accessToken || '');
              state.loginLoading = false;
              state.loginError = '';
              renderApp();
              loadDashboardData();
            } else {
              state.loginError = data.message || 'Login gagal. Pastikan Anda menggunakan akun Administrator.';
              state.loginLoading = false;
              renderApp();
            }
          } catch (err) {
            state.loginError = `Gagal menghubungi server backend (${API_BASE}).`;
            state.loginLoading = false;
            renderApp();
          }
        });
      }
    }

    // ══════════════════════════════════════════════════════════════════════════
    // 2. DASHBOARD MAIN LAYOUT & SIDEBAR
    // ══════════════════════════════════════════════════════════════════════════
    function toggleSidebar() {
      state.isSidebarOpen = !state.isSidebarOpen;
      localStorage.setItem('catu_sidebar_open', state.isSidebarOpen);
      renderApp();
    }

    // ══════════════════════════════════════════════════════════════════════════
    // 2. DASHBOARD MAIN LAYOUT & SIDEBAR (COLLAPSIBLE / TUTUP BUKA)
    // ══════════════════════════════════════════════════════════════════════════
    function renderDashboardLayout() {
      const adminName = state.currentUser?.fullName || state.currentUser?.full_name || 'Super Admin CATU';
      const pendingApprovalsCount = state.users.filter(u => (u.account_status || u.accountStatus) === 'PENDING_APPROVAL').length;
      const activeUmatCount = state.users.filter(u => (u.role_code || u.roleCode) === 'UMAT' && (u.account_status || u.accountStatus) === 'APPROVED').length;
      const activePengurusCount = state.users.filter(u => (u.role_code || u.roleCode) === 'PENGURUS_LINGKUNGAN' && (u.account_status || u.accountStatus) === 'APPROVED').length;
      const activeRomoParokiCount = state.users.filter(u => (u.role_code || u.roleCode) === 'ROMO_PAROKI' && (u.account_status || u.accountStatus) === 'APPROVED').length;
      const activeRomoOrdoCount = state.users.filter(u => (u.role_code || u.roleCode) === 'ROMO_ORDO' && (u.account_status || u.accountStatus) === 'APPROVED').length;
      const activeAnnotationsCount = state.agentation.annotations.filter(a => !a.resolved).length;
      const isOpen = state.isSidebarOpen !== false;

      return `
        <div class="h-full flex relative overflow-hidden">
          <!-- Sidebar Nav (Left) - Collapsible -->
          <div class="${isOpen ? 'w-64' : 'w-20'} bg-slate-900 border-r border-slate-800 flex flex-col justify-between flex-shrink-0 transition-all duration-300 ease-in-out">
            <div class="overflow-y-auto custom-scrollbar">
              <!-- Sidebar Header -->
              ${isOpen ? `
                <div class="p-5 flex items-center justify-between border-b border-slate-800">
                  <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-xl bg-white p-1 shadow border border-amber-500 flex items-center justify-center flex-shrink-0">
                      <img src="assets/images/logoCatu.png" alt="CATU" class="h-full object-contain" />
                    </div>
                    <div>
                      <h2 class="text-sm font-extrabold text-white tracking-wide">CATU ADMIN</h2>
                      <p class="text-[9.5px] font-bold text-amber-400">PORTAL PUSAT SISTEM</p>
                    </div>
                  </div>
                  <button onclick="toggleSidebar()" class="p-1.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition" title="Tutup Sidebar">
                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                  </button>
                </div>
              ` : `
                <div class="p-3.5 flex flex-col items-center border-b border-slate-800 space-y-2">
                  <div class="w-10 h-10 rounded-xl bg-white p-1 shadow border border-amber-500 flex items-center justify-center flex-shrink-0">
                    <img src="assets/images/logoCatu.png" alt="CATU" class="h-full object-contain" />
                  </div>
                  <button onclick="toggleSidebar()" class="p-1 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition" title="Buka Sidebar">
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                  </button>
                </div>
              `}

              <!-- Nav Items -->
              <nav class="${isOpen ? 'p-3 space-y-4' : 'p-2 space-y-3'}">
                <div>
                  ${isOpen ? `<p class="px-3 text-[10px] font-extrabold uppercase tracking-wider text-slate-500 mb-1.5">Utama</p>` : `<div class="h-px bg-slate-800 my-1 mx-2"></div>`}
                  <div class="space-y-1">
                    ${renderNavItem('overview', 'layout-dashboard', 'Ringkasan & Analytics')}
                    ${renderNavItem('orders', 'clipboard-list', 'Manajemen Pelayanan', state.analytics?.orders?.pending)}
                  </div>
                </div>

                <div>
                  ${isOpen ? `<p class="px-3 text-[10px] font-extrabold uppercase tracking-wider text-slate-500 mb-1.5">Pengguna Aktif</p>` : `<div class="h-px bg-slate-800 my-1 mx-2"></div>`}
                  <div class="space-y-1">
                    ${renderNavItem('umat', 'users', 'Umat Katolik', activeUmatCount, 'bg-blue-600')}
                    ${renderNavItem('pengurus', 'briefcase', 'Pengurus Lingkungan', activePengurusCount, 'bg-indigo-600')}
                    ${renderNavItem('romo_paroki', 'church', 'Romo Paroki', activeRomoParokiCount, 'bg-emerald-600')}
                    ${renderNavItem('romo_ordo', 'cross', 'Romo Ordo (On-Demand)', activeRomoOrdoCount, 'bg-purple-600')}
                  </div>
                </div>

                <div>
                  ${isOpen ? `<p class="px-3 text-[10px] font-extrabold uppercase tracking-wider text-slate-500 mb-1.5">Tata Kelola & Data</p>` : `<div class="h-px bg-slate-800 my-1 mx-2"></div>`}
                  <div class="space-y-1">
                    ${renderNavItem('approvals', 'shield-check', 'Persetujuan Pendaftaran', pendingApprovalsCount, 'bg-amber-500')}
                    ${renderNavItem('master', 'map-pin', 'Master Data Gereja')}
                    ${renderNavItem('chat', 'messages-square', 'Monitoring Chat')}
                    ${renderNavItem('qa', 'flask-conical', 'QA & Live Tests')}
                  </div>
                </div>
              </nav>
            </div>

            <!-- Sidebar Bottom Action Section -->
            ${isOpen ? `
              <div class="p-4 border-t border-slate-800 space-y-2">
                <button onclick="toggleAgentationMode()"
                  class="w-full py-2.5 px-3 rounded-xl ${state.agentation.enabled ? 'bg-amber-500 text-slate-950 font-black ring-2 ring-amber-300' : 'bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold'} text-xs flex items-center justify-between transition shadow">
                  <div class="flex items-center space-x-2">
                    <i data-lucide="scan" class="w-4 h-4"></i>
                    <span>🎯 Agentation UI</span>
                  </div>
                  <span class="px-1.5 py-0.5 rounded-full text-[10px] ${state.agentation.enabled ? 'bg-slate-900 text-amber-400' : 'bg-amber-500/20 text-amber-400'} font-black">
                    ${activeAnnotationsCount}
                  </span>
                </button>

                <button id="logoutBtn" class="w-full py-2.5 px-3 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-400 text-xs font-bold flex items-center space-x-2 transition">
                  <i data-lucide="log-out" class="w-4 h-4"></i>
                  <span>Keluar Akun Admin</span>
                </button>
              </div>
            ` : `
              <div class="p-2.5 border-t border-slate-800 space-y-2 flex flex-col items-center">
                <button onclick="toggleAgentationMode()" title="🎯 Agentation UI (${activeAnnotationsCount} catatan)"
                  class="w-11 h-11 rounded-xl relative flex items-center justify-center ${state.agentation.enabled ? 'bg-amber-500 text-slate-950 font-black ring-2 ring-amber-300' : 'bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold'} text-xs transition shadow">
                  <i data-lucide="scan" class="w-5 h-5"></i>
                  ${activeAnnotationsCount > 0 ? `
                    <span class="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-red-500 text-white text-[9px] font-black flex items-center justify-center ring-2 ring-slate-900">${activeAnnotationsCount}</span>
                  ` : ''}
                </button>

                <button id="logoutBtn" title="Keluar Akun Admin" class="w-11 h-11 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-400 flex items-center justify-center transition">
                  <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
              </div>
            `}
          </div>

          <!-- Main Content View -->
          <div class="flex-1 flex flex-col overflow-hidden bg-slate-100 min-w-0">
            <header class="bg-white border-b border-slate-200 px-6 lg:px-8 py-4 flex items-center justify-between flex-shrink-0">
              <div class="flex items-center space-x-3">
                <button onclick="toggleSidebar()"
                  class="p-2 rounded-xl bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-600 hover:text-blue-950 transition shadow-xs flex-shrink-0"
                  title="${isOpen ? 'Tutup Sidebar' : 'Buka Sidebar'}">
                  <i data-lucide="${isOpen ? 'panel-left-close' : 'panel-left-open'}" class="w-5 h-5"></i>
                </button>
                <div>
                  <p class="text-xs font-semibold text-slate-500">Admin Portal / <span class="text-blue-950 font-bold capitalize">${state.currentTab.replace('_', ' ')}</span></p>
                  <h1 class="text-xl font-extrabold text-slate-900 tracking-tight capitalize">${getTabTitle(state.currentTab)}</h1>
                </div>
              </div>

              <div class="flex items-center space-x-3 lg:space-x-4">
                <button onclick="toggleAgentationMode()"
                  class="flex items-center px-3 py-1.5 rounded-full text-xs font-bold transition ${
                    state.agentation.enabled ? 'bg-amber-500 text-slate-950 ring-2 ring-amber-300' : 'bg-amber-50 border border-amber-200 text-amber-800 hover:bg-amber-100'
                  }">

    function getTabTitle(tab) {
      if (tab === 'overview') return 'Ringkasan & Analytics';
      if (tab === 'orders') return 'Manajemen Pelayanan';
      if (tab === 'umat') return 'Daftar Umat Katolik Aktif';
      if (tab === 'pengurus') return 'Daftar Pengurus Lingkungan Aktif';
      if (tab === 'romo_paroki') return 'Daftar Romo Paroki Aktif';
      if (tab === 'romo_ordo') return 'Daftar Romo Ordo Aktif (On-Demand)';
      if (tab === 'approvals') return 'Persetujuan Akun Pendaftaran Baru';
      if (tab === 'master') return 'Master Data Wilayah & Gereja';
      if (tab === 'chat') return 'Monitoring Group Chat Pelayanan';
      if (tab === 'qa') return 'QA & Live Test Runner';
      return tab;

    function setTab(tab) {
      state.currentTab = tab;
      if (tab === 'master') {
        loadMasterData(state.masterSubTab || 'paroki');

      renderApp();

    function attachDashboardListeners() {
      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
          localStorage.removeItem('catu_admin_user');
          localStorage.removeItem('catu_admin_token');
          state.currentUser = null;
          state.token = '';
          renderApp();

      if (refreshBtn) {

                  <th class="px-6 py-3.5 text-right">AKSI</th>

              <tbody class="divide-y divide-slate-200 font-medium text-slate-700">
                ${list.map(u => `
                  <tr class="hover:bg-slate-50/80 transition">
                    <td class="px-6 py-4 font-extrabold text-slate-900 text-sm">${u.full_name || 'Romo Ordo'}</td>
                    <td class="px-6 py-4"><span class="px-2.5 py-1 rounded-md bg-purple-50 text-purple-900 border border-purple-200 font-bold text-[11px]">${u.ordo_name || 'Ordo Religius'}</span></td>
                    <td class="px-6 py-4 font-semibold text-slate-900">${u.phone_number}</td>
                    <td class="px-6 py-4 text-right">

                        <button onclick="viewUserProfileModal('${u.id}')"

    // ── Tab: Approvals ──
    function renderApprovalsTab() {

        if (status !== 'PENDING_APPROVAL') return false;
        if (q) {
          const name = (u.full_name || u.fullName || '').toLowerCase();

          if (!name.includes(q) && !email.includes(q) && !phone.includes(q)) return false;

      });

      return `

          <div class="p-5 border-b border-slate-200 flex items-center justify-between">
            <input type="text" placeholder="Cari pendaftaran..." value="${state.approvalsSearch}"
              oninput="state.approvalsSearch = this.value; renderApp();"
              class="w-full max-w-md pl-4 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-blue-950" />

                  <th class="px-6 py-3.5">NO. WHATSAPP</th>
                  <th class="px-6 py-3.5">PERAN DIAJUKAN</th>

                    <td class="px-6 py-4 font-semibold">${u.phone_number}</td>
                    <td class="px-6 py-4"><span class="px-2.5 py-1 rounded-md bg-blue-50 text-blue-950 border border-blue-200 font-bold text-[11px]">${u.role_name || u.role_code}</span></td>
                    <td class="px-6 py-4">${u.paroki_name || u.kota_name || '-'}</td>
                    <td class="px-6 py-4 text-right">
                      <button onclick="approveUserAction('${u.id}', 'APPROVED')" class="px-3 py-1.5 rounded-lg bg-emerald-600 text-white font-bold mr-1">Setujui</button>
                      <button onclick="approveUserAction('${u.id}', 'REJECTED')" class="px-3 py-1.5 rounded-lg bg-rose-600 text-white font-bold mr-1">Tolak</button>

    // ══════════════════════════════════════════════════════════════════════════
    // 3. MASTER DATA TAB (FULL DATABASE CRUD)
    // ══════════════════════════════════════════════════════════════════════════
    function renderMasterTab() {
      const sub = state.masterSubTab || 'paroki';
      const search = (state.masterSearch || '').toLowerCase().trim();
      const list = state.masterDataList || [];

      // Filtered items based on search and filters
      const filtered = list.filter(item => {
        if (search) {
          const matchName = item.name && item.name.toLowerCase().includes(search);
          const matchCode = item.code && item.code.toLowerCase().includes(search);
          const matchAddress = item.address && item.address.toLowerCase().includes(search);
          const matchKeuskupan = item.keuskupan_name && item.keuskupan_name.toLowerCase().includes(search);
          const matchParoki = item.paroki_name && item.paroki_name.toLowerCase().includes(search);
          const matchWilayah = item.wilayah_name && item.wilayah_name.toLowerCase().includes(search);
          const matchDesc = item.description && item.description.toLowerCase().includes(search);
          if (!matchName && !matchCode && !matchAddress && !matchKeuskupan && !matchParoki && !matchWilayah && !matchDesc) {
            return false;
          }
        }
        return true;
      });

      const getEntityLabel = (s) => {
        if (s === 'keuskupan') return 'Keuskupan';
        if (s === 'paroki') return 'Paroki';
        if (s === 'wilayah') return 'Wilayah';
        if (s === 'lingkungan') return 'Lingkungan';
        if (s === 'ordo') return 'Ordo / Kongregasi';
        if (s === 'services') return 'Kategori Pelayanan';
        return s;
      };

      return `
        <div class="space-y-6 animate-fade-in">
          <!-- Sub-Tab Navigation Bar -->
          <div class="bg-white rounded-2xl p-2 shadow-xs border border-slate-200 flex flex-wrap gap-1.5">
            ${[
              { id: 'keuskupan', icon: 'landmark', label: 'Keuskupan', count: state.keuskupan?.length },
              { id: 'paroki', icon: 'church', label: 'Paroki', count: state.paroki?.length },
              { id: 'wilayah', icon: 'map-pin', label: 'Wilayah' },
              { id: 'lingkungan', icon: 'home', label: 'Lingkungan' },
              { id: 'ordo', icon: 'cross', label: 'Ordo / Kongregasi', count: state.ordo?.length },
              { id: 'services', icon: 'clipboard-list', label: 'Kategori Pelayanan', count: state.serviceCategories?.length }
            ].map(tab => {
              const active = sub === tab.id;
              return `
                <button onclick="setMasterSubTab('${tab.id}')"
                  class="flex items-center space-x-2 px-4 py-2.5 rounded-xl font-extrabold text-xs transition ${
                    active 
                      ? 'bg-blue-950 text-white shadow-md shadow-blue-950/20' 
                      : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'
                  }">
                  <i data-lucide="${tab.icon}" class="w-4 h-4 ${active ? 'text-amber-400' : 'text-slate-400'}"></i>
                  <span>${tab.label}</span>
                  ${tab.count !== undefined && tab.count > 0 ? `
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-black ${active ? 'bg-amber-400 text-slate-900' : 'bg-slate-200 text-slate-700'}">
                      ${tab.count}
                    </span>
                  ` : ''}
                </button>
              `;
            }).join('')}
          </div>

          <!-- Main Table Card -->
          <div class="bg-white rounded-2xl shadow-xs border border-slate-200 overflow-hidden">
            <!-- Header Toolbar -->
            <div class="p-5 border-b border-slate-200 flex flex-col lg:flex-row lg:items-center justify-between gap-4 bg-slate-50/50">
              <div class="flex items-center space-x-3">
                <div class="p-2.5 rounded-xl bg-blue-950 text-amber-400 shadow-md">
                  <i data-lucide="database" class="w-5 h-5"></i>
                </div>
                <div>
                  <h3 class="text-sm font-black text-slate-900">Master Data: ${getEntityLabel(sub)}</h3>
                  <p class="text-xs text-slate-500">Daftar entitas aktif dari database PostgreSQL (${filtered.length} data ditemukan)</p>
                </div>
              </div>

              <!-- Search & Action Controls -->
              <div class="flex flex-wrap items-center gap-3">
                <!-- Search Input -->
                <div class="relative">
                  <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                  <input type="text" value="${state.masterSearch || ''}" oninput="state.masterSearch = this.value; renderApp();"
                    placeholder="Cari ${getEntityLabel(sub)}..."
                    class="pl-9 pr-4 py-2 bg-white border border-slate-200 rounded-xl text-xs font-semibold text-slate-900 focus:outline-none focus:ring-2 focus:ring-amber-500 w-52 lg:w-64 shadow-xs" />
                </div>

                <!-- Contextual Filters -->
                ${sub === 'paroki' ? `
                  <select onchange="state.masterFilterKeuskupanId = this.value; loadMasterData('paroki');"
                    class="px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-amber-500 shadow-xs">
                    <option value="">-- Semua Keuskupan --</option>
                    ${state.keuskupan.map(k => `
                      <option value="${k.id}" ${String(state.masterFilterKeuskupanId) === String(k.id) ? 'selected' : ''}>${k.name}</option>
                    `).join('')}
                  </select>
                ` : ''}

                ${sub === 'wilayah' ? `
                  <select onchange="state.masterFilterParokiId = this.value; loadMasterData('wilayah');"
                    class="px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-amber-500 shadow-xs">
                    <option value="">-- Semua Paroki --</option>
                    ${state.paroki.map(p => `
                      <option value="${p.id}" ${String(state.masterFilterParokiId) === String(p.id) ? 'selected' : ''}>${p.name}</option>
                    `).join('')}
                  </select>
                ` : ''}

                <!-- Add Button -->
                <button onclick="openCreateMasterModal('${sub}')"
                  class="px-4 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white font-extrabold text-xs shadow-md shadow-amber-500/20 flex items-center space-x-1.5 transition transform hover:-translate-y-0.5">
                  <i data-lucide="plus-circle" class="w-4 h-4"></i>
                  <span>Tambah ${getEntityLabel(sub)}</span>
                </button>
              </div>
            </div>

            <!-- Table View -->
            ${state.isMasterLoading ? `
              <div class="p-16 text-center text-slate-500 space-y-3">
                <span class="w-8 h-8 border-3 border-amber-500 border-t-transparent rounded-full animate-spin inline-block"></span>
                <p class="text-xs font-bold">Memuat master data dari database...</p>
              </div>
            ` : filtered.length === 0 ? `
              <div class="p-16 text-center text-slate-400 space-y-2">
                <i data-lucide="folder-x" class="w-10 h-10 mx-auto text-slate-300"></i>
                <p class="text-xs font-bold text-slate-600">Tidak ada data ${getEntityLabel(sub)} yang sesuai filter atau pencarian.</p>
                <button onclick="openCreateMasterModal('${sub}')" class="text-xs font-bold text-amber-600 hover:underline">
                  + Klik untuk menambahkan data baru
                </button>
              </div>
            ` : `
              <div class="overflow-x-auto custom-scrollbar">
                <table class="w-full text-left border-collapse text-xs">
                  <thead>
                    <tr class="bg-slate-50/80 border-b border-slate-200 text-slate-500 font-extrabold tracking-wider uppercase text-[10px]">
                      <th class="py-3.5 px-4 w-16 text-center">ID</th>
                      ${renderMasterTableHeaders(sub)}
                      <th class="py-3.5 px-4 text-center w-36">AKSI</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100">
                    ${filtered.map(item => renderMasterTableRow(sub, item)).join('')}
                  </tbody>
                </table>
              </div>
            `}
          </div>
        </div>
      `;
    }

    function renderMasterTableHeaders(sub) {
      if (sub === 'keuskupan') {
        return `
          <th class="py-3.5 px-4">NAMA KEUSKUPAN</th>
          <th class="py-3.5 px-4">KODE</th>
          <th class="py-3.5 px-4 text-center">TOTAL PAROKI</th>
          <th class="py-3.5 px-4">TANGGAL DIBUAT</th>
        `;
      } else if (sub === 'paroki') {
        return `
          <th class="py-3.5 px-4">NAMA PAROKI</th>
          <th class="py-3.5 px-4">KEUSKUPAN</th>
          <th class="py-3.5 px-4 text-center">TOTAL WILAYAH</th>
          <th class="py-3.5 px-4">ALAMAT</th>
        `;
      } else if (sub === 'wilayah') {
        return `
          <th class="py-3.5 px-4">NAMA WILAYAH</th>
          <th class="py-3.5 px-4">PAROKI</th>
          <th class="py-3.5 px-4">KEUSKUPAN</th>
          <th class="py-3.5 px-4 text-center">TOTAL LINGKUNGAN</th>
        `;
      } else if (sub === 'lingkungan') {
        return `
          <th class="py-3.5 px-4">NAMA LINGKUNGAN</th>
          <th class="py-3.5 px-4">WILAYAH</th>
          <th class="py-3.5 px-4">PAROKI</th>
          <th class="py-3.5 px-4 text-center">TOTAL UMAT</th>
        `;
      } else if (sub === 'ordo') {
        return `
          <th class="py-3.5 px-4">NAMA ORDO / KONGREGASI</th>
          <th class="py-3.5 px-4">KODE</th>
          <th class="py-3.5 px-4 text-center">TOTAL ROMO</th>
          <th class="py-3.5 px-4">ALAMAT / MARKAS</th>
        `;
      } else if (sub === 'services') {
        return `
          <th class="py-3.5 px-4">NAMA SAKRAMEN / PELAYANAN</th>
          <th class="py-3.5 px-4">DESKRIPSI</th>
          <th class="py-3.5 px-4 text-center">URGENT DEFAULT</th>
          <th class="py-3.5 px-4 text-center">STATUS AKTIF</th>
          <th class="py-3.5 px-4 text-center">TOTAL ORDER</th>
        `;
      }
      return '';
    }

    function renderMasterTableRow(sub, item) {
      const escapedItem = JSON.stringify(item).replace(/'/g, "&#39;");
      return `
        <tr class="hover:bg-slate-50/70 transition">
          <td class="py-3.5 px-4 text-center font-mono font-bold text-slate-400">#${item.id}</td>
          ${renderMasterTableColumns(sub, item)}
          <td class="py-3.5 px-4 text-center">
            <div class="flex items-center justify-center space-x-1.5">
              ${sub === 'keuskupan' ? `
                <button onclick='openCreateMasterModal("paroki", { keuskupan_id: ${item.id} })'
                  class="px-2.5 py-1.5 rounded-lg bg-blue-50 hover:bg-blue-100 border border-blue-200 text-blue-900 font-bold text-[11px] flex items-center space-x-1 transition shadow-2xs" title="Tambah Paroki Baru di Keuskupan Ini">
                  <i data-lucide="plus" class="w-3.5 h-3.5 text-blue-600"></i>
                  <span>+ Paroki</span>
                </button>
              ` : ''}
              ${sub === 'paroki' ? `
                <button onclick='openCreateMasterModal("wilayah", { keuskupan_id: ${item.keuskupan_id || 'null'}, paroki_id: ${item.id} })'
                  class="px-2.5 py-1.5 rounded-lg bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-900 font-bold text-[11px] flex items-center space-x-1 transition shadow-2xs" title="Tambah Wilayah Baru di Paroki Ini">
                  <i data-lucide="plus" class="w-3.5 h-3.5 text-emerald-600"></i>
                  <span>+ Wilayah</span>
                </button>
              ` : ''}
              ${sub === 'wilayah' ? `
                <button onclick='openCreateMasterModal("lingkungan", { paroki_id: ${item.paroki_id || 'null'}, wilayah_id: ${item.id} })'
                  class="px-2.5 py-1.5 rounded-lg bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 text-indigo-900 font-bold text-[11px] flex items-center space-x-1 transition shadow-2xs" title="Tambah Lingkungan Baru di Wilayah Ini">
                  <i data-lucide="plus" class="w-3.5 h-3.5 text-indigo-600"></i>
                  <span>+ Lingkungan</span>
                </button>
              ` : ''}

              <button onclick='openEditMasterModal("${sub}", ${escapedItem})'
                class="px-2.5 py-1.5 rounded-lg bg-amber-50 hover:bg-amber-100 border border-amber-200 text-amber-900 font-bold text-[11px] flex items-center space-x-1 transition shadow-2xs" title="Edit Data">
                <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                <span>Edit</span>
              </button>
              <button onclick='confirmDeleteMaster("${sub}", ${item.id}, "${(item.name || '').replace(/"/g, '')}")'
                class="px-2.5 py-1.5 rounded-lg bg-rose-50 hover:bg-rose-100 border border-rose-200 text-rose-700 font-bold text-[11px] flex items-center space-x-1 transition shadow-2xs" title="Hapus Data">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                <span>Hapus</span>
              </button>
            </div>
          </td>
        </tr>
      `;
    }

    function renderMasterTableColumns(sub, item) {
      if (sub === 'keuskupan') {
        return `
          <td class="py-3.5 px-4 font-bold text-slate-900">

    // ── Master Modal (Create / Edit) ──
    function renderMasterModal() {
      const modal = state.activeMasterModal;
      if (!modal) return '';
      const { type, mode, data } = modal;
      const isEdit = mode === 'EDIT';

      const getTitle = () => {
        const prefix = isEdit ? 'Perbarui Data' : 'Tambah Baru';
        if (type === 'keuskupan') return `${prefix} Keuskupan`;
        if (type === 'paroki') return `${prefix} Paroki`;
        if (type === 'wilayah') return `${prefix} Wilayah`;
        if (type === 'lingkungan') return `${prefix} Lingkungan`;
        if (type === 'ordo') return `${prefix} Ordo / Kongregasi`;
        if (type === 'services') return `${prefix} Kategori Pelayanan`;
        return `${prefix} Master`;
      };

      return `
        <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto animate-fade-in">
          <div class="bg-white rounded-3xl max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-slate-200 custom-scrollbar my-8 overflow-hidden">
            <!-- Header Banner -->
            <div class="bg-gradient-to-r from-blue-950 via-slate-900 to-indigo-950 p-6 text-white relative">
              <button onclick="state.activeMasterModal = null; renderApp();"
                class="absolute top-4 right-4 p-2 rounded-full bg-white/10 hover:bg-white/20 text-white/80 hover:text-white transition">
                <i data-lucide="x" class="w-4 h-4"></i>
              </button>

              <div class="flex items-center space-x-3.5">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-amber-400 to-amber-600 text-white flex items-center justify-center shadow-lg border-2 border-white/20">
                  <i data-lucide="${isEdit ? 'edit' : 'plus'}" class="w-6 h-6"></i>
                </div>
                <div>
                  <h3 class="text-base font-black text-white">${getTitle()}</h3>
                  <p class="text-xs text-slate-300">
                    ${isEdit ? `Mengubah data ID #${data.id}` : 'Menyimpan entitas baru ke database'}
                  </p>
                </div>
              </div>
            </div>

            <!-- Form Body -->
            <div class="p-6 space-y-4 text-xs">
              ${state.masterModalError ? `
                <div class="p-3.5 rounded-2xl bg-rose-50 border border-rose-200 text-rose-800 text-xs font-bold flex items-start space-x-2 shadow-xs">
                  <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0 text-rose-600 mt-0.5"></i>
                  <span>${state.masterModalError}</span>
                </div>
              ` : ''}

              <form id="masterDataForm" onsubmit="handleSaveMaster(event)" class="space-y-4">
                ${renderMasterModalFields(type, data)}

                <div class="pt-4 border-t border-slate-200 flex items-center justify-end space-x-2.5">
                  <button type="button" onclick="state.activeMasterModal = null; renderApp();"
                    class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-extrabold text-xs transition">
                    Batal
                  </button>
                  <button type="submit" ${state.isSavingMaster ? 'disabled' : ''}
                    class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white font-black text-xs flex items-center space-x-2 shadow-md shadow-amber-500/20 transition transform hover:-translate-y-0.5 disabled:opacity-50">
                    ${state.isSavingMaster ? `
                      <span class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                      <span>Menyimpan...</span>
                    ` : `
                      <i data-lucide="save" class="w-4 h-4"></i>
                      <span>${isEdit ? 'Simpan Perubahan' : 'Tambah Sekarang'}</span>

    function copyAgentationPromptToClipboard() {
      const list = state.agentation.annotations.filter(a => !a.resolved);
      if (list.length === 0) {
        alert('Belum ada catatan revisi untuk disalin.');
        return;
      }

      let prompt = `### 🎯 DAFTAR REVISI UI / DESAIN AGENTATION (${state.currentTab.toUpperCase()}):\n\n`;
      list.forEach((a, i) => {
        prompt += `${i + 1}. [${a.category}] Elemen: \`${a.elementSelector}\`\n   - Catatan: "${a.note}"\n   - Tag: <${a.elementTag}>\n\n`;
      });
      prompt += `Tolong revisi dan perbaiki elemen-elemen UI di atas sesuai catatan tepat sasaran.`;

      navigator.clipboard.writeText(prompt).then(() => {
        state.agentation.annotations = [];
        localStorage.setItem('catu_agentation_annotations', JSON.stringify([]));
        state.agentation.enabled = false;
        state.agentation.expanded = false;
        
        const box = document.getElementById('agentation-inspector-box');
        if (box) box.style.display = 'none';

        renderApp();
        alert('✓ Seluruh catatan revisi Agentation berhasil disalin ke clipboard & pin otomatis dibersihkan!\nSilakan langsung tempelkan (Paste) prompt ke chat AI.');
      }).catch(() => {
        state.agentation.annotations = [];
        localStorage.setItem('catu_agentation_annotations', JSON.stringify([]));
        renderApp();
        alert('✓ Pin revisi telah dibersihkan.');
      });
    }

    // ── Mouse Listeners for Agentation (Popup-Compatible) ──
    window.addEventListener('mousemove', (e) => {
      if (!state.agentation.enabled) {
        const box = document.getElementById('agentation-inspector-box');
        if (box) box.style.display = 'none';
        return;
      }

      const target = document.elementFromPoint(e.clientX, e.clientY);
      if (!target || target.closest('[data-feedback-toolbar]') || target.closest('.agentation-pin') || target.closest('[data-agentation-dialog]') || target.id === 'agentation-inspector-box') {
        return;
      }

      const rect = target.getBoundingClientRect();
      const box = document.getElementById('agentation-inspector-box');
      const label = document.getElementById('agentation-inspector-label');
      if (box && label) {
        box.style.display = 'block';
        box.style.left = `${rect.left}px`;
        box.style.top = `${rect.top}px`;
        box.style.width = `${rect.width}px`;
        box.style.height = `${rect.height}px`;

        const tag = target.tagName.toLowerCase();
        const idStr = target.id ? ('#' + target.id) : '';
        const cls = target.className && typeof target.className === 'string' ? ('.' + target.className.trim().split(' ')[0]) : '';
        label.textContent = `${tag}${idStr || cls} (${Math.round(rect.width)}x${Math.round(rect.height)})`;
      }
    });

    window.addEventListener('click', (e) => {
      if (!state.agentation.enabled) return;

      const target = document.elementFromPoint(e.clientX, e.clientY);
      if (!target || target.closest('[data-feedback-toolbar]') || target.closest('.agentation-pin') || target.closest('[data-agentation-dialog]') || target.id === 'agentation-inspector-box') {
        return;
      }

      e.preventDefault();
      e.stopPropagation();

      const modalParent = target.closest('.fixed:not([data-agentation-dialog])');
      let modalPrefix = '';
      if (modalParent) {
        const modalTitle = modalParent.querySelector('h3, h4')?.innerText?.trim() || 'Popup Modal';
        modalPrefix = `[Popup: ${modalTitle}] > `;
      }

      let path = [];
      let el = target;
      while (el && el.nodeType === Node.ELEMENT_NODE && path.length < 4) {
        if (el === modalParent) break;
        let sel = el.nodeName.toLowerCase();
        if (el.id) {
          sel += '#' + el.id;
          path.unshift(sel);
          break;
        } else {
          let sib = el, nth = 1;
          while (sib = sib.previousElementSibling) {
            if (sib.nodeName.toLowerCase() == sel) nth++;
          }
          if (nth != 1) sel += ":nth-of-type("+nth+")";
        }
        path.unshift(sel);
        el = el.parentNode;
      }

      const fullSelector = modalPrefix + (path.join(' > ') || target.tagName.toLowerCase());

      state.agentation.pendingPin = {
        x: e.clientX,
        y: e.clientY,
        selector: fullSelector,
        tag: target.tagName.toLowerCase(),
        text: (target.value || target.placeholder || target.innerText || target.textContent || '').trim().substring(0, 100),
      };

      const box = document.getElementById('agentation-inspector-box');
      if (box) box.style.display = 'none';

      renderApp();
    }, true);

    function onEditPhoneInput(input) {
      let val = input.value.replace(/\D/g, '');
      if (val.startsWith('62')) val = val.substring(2);
      if (val.startsWith('0')) val = val.substring(1);
      if (val.length > 0 && !val.startsWith('8')) {
        val = '8' + val.replace(/^[^8]+/, '');
      }
      input.value = val;
    }

    function getStatusBadgeClass(status) {
      const s = (status || '').toUpperCase();
      if (s === 'CONFIRMED' || s === 'ACCEPTED') return 'bg-emerald-50 text-emerald-700 border border-emerald-200';
      if (s === 'DONE') return 'bg-blue-50 text-blue-700 border border-blue-200';
      if (s === 'FAIL' || s === 'REJECTED') return 'bg-red-50 text-red-700 border border-red-200';
      return 'bg-amber-50 text-amber-700 border border-amber-200';

    async function loadMasterData(subTab) {
      if (subTab) state.masterSubTab = subTab;
      state.isMasterLoading = true;
      renderApp();

      try {
        const tab = state.masterSubTab;
        let url = '';
        if (tab === 'keuskupan') {
          url = `${API_BASE}/master/keuskupan`;
        } else if (tab === 'paroki') {
          url = `${API_BASE}/master/paroki${state.masterFilterKeuskupanId ? '?keuskupanId=' + state.masterFilterKeuskupanId : ''}`;
        } else if (tab === 'wilayah') {
          url = `${API_BASE}/master/wilayah${state.masterFilterParokiId ? '?parokiId=' + state.masterFilterParokiId : ''}`;
        } else if (tab === 'lingkungan') {
          url = `${API_BASE}/master/lingkungan${state.masterFilterWilayahId ? '?wilayahId=' + state.masterFilterWilayahId : ''}`;
        } else if (tab === 'ordo') {
          url = `${API_BASE}/master/ordo`;
        } else if (tab === 'services') {
          url = `${API_BASE}/master/service-categories`;
        }

        const res = await fetch(url);
        const data = await res.json();
        state.masterDataList = Array.isArray(data) ? data : [];

        // Update lookup state
        if (tab === 'keuskupan') state.keuskupan = state.masterDataList;
        if (tab === 'paroki') state.paroki = state.masterDataList;
        if (tab === 'ordo') state.ordo = state.masterDataList;
        if (tab === 'services') state.serviceCategories = state.masterDataList;
      } catch (err) {
        console.error('Error loading master data:', err);
      } finally {
        state.isMasterLoading = false;
        renderApp();
      }
    }

    async function handleSaveMaster(event) {
      if (event) event.preventDefault();
      const modal = state.activeMasterModal;
      if (!modal) return;

      const { type, mode, data } = modal;
      let endpoint = '';
      let method = mode === 'CREATE' ? 'POST' : 'PUT';
      let payload = {};

      try {
        // 1. Read DOM inputs FIRST before any renderApp call
        if (type === 'keuskupan') {
          endpoint = mode === 'CREATE' ? `${API_BASE}/master/keuskupan` : `${API_BASE}/master/keuskupan/${data.id}`;
          const nameVal = document.getElementById('masterNameInput')?.value?.trim();
          const codeVal = document.getElementById('masterCodeInput')?.value?.trim();
          if (!nameVal) throw new Error('Nama Keuskupan wajib diisi');
          payload = { name: nameVal };
          if (codeVal) payload.code = codeVal;
          modal.data.name = nameVal;
          modal.data.code = codeVal;
        } else if (type === 'paroki') {
          endpoint = mode === 'CREATE' ? `${API_BASE}/master/paroki` : `${API_BASE}/master/paroki/${data.id}`;
          const keuskupanIdVal = parseInt(document.getElementById('masterKeuskupanIdInput')?.value);
          const nameVal = document.getElementById('masterNameInput')?.value?.trim();
          const addressVal = document.getElementById('masterAddressInput')?.value?.trim();
          if (!keuskupanIdVal || isNaN(keuskupanIdVal)) throw new Error('Silakan pilih Keuskupan terlebih dahulu');
          if (!nameVal) throw new Error('Nama Paroki wajib diisi');
          payload = { keuskupanId: keuskupanIdVal, name: nameVal };
          if (addressVal) payload.address = addressVal;
          modal.data.keuskupan_id = keuskupanIdVal;
          modal.data.name = nameVal;
          modal.data.address = addressVal;
        } else if (type === 'wilayah') {
          endpoint = mode === 'CREATE' ? `${API_BASE}/master/wilayah` : `${API_BASE}/master/wilayah/${data.id}`;
          const parokiIdVal = parseInt(document.getElementById('masterParokiIdInput')?.value);
          const nameVal = document.getElementById('masterNameInput')?.value?.trim();
          if (!parokiIdVal || isNaN(parokiIdVal)) throw new Error('Silakan pilih Paroki terlebih dahulu');
          if (!nameVal) throw new Error('Nama Wilayah wajib diisi');
          payload = { parokiId: parokiIdVal, name: nameVal };
          modal.data.paroki_id = parokiIdVal;
          modal.data.name = nameVal;
        } else if (type === 'lingkungan') {
          endpoint = mode === 'CREATE' ? `${API_BASE}/master/lingkungan` : `${API_BASE}/master/lingkungan/${data.id}`;
          const wilayahIdVal = parseInt(document.getElementById('masterWilayahIdInput')?.value);
          const nameVal = document.getElementById('masterNameInput')?.value?.trim();
          if (!wilayahIdVal || isNaN(wilayahIdVal)) throw new Error('Silakan pilih Wilayah terlebih dahulu');
          if (!nameVal) throw new Error('Nama Lingkungan wajib diisi');
          payload = { wilayahId: wilayahIdVal, name: nameVal };
          modal.data.wilayah_id = wilayahIdVal;
          modal.data.name = nameVal;
        } else if (type === 'ordo') {
          endpoint = mode === 'CREATE' ? `${API_BASE}/master/ordo` : `${API_BASE}/master/ordo/${data.id}`;
          const nameVal = document.getElementById('masterNameInput')?.value?.trim();
          const codeVal = document.getElementById('masterCodeInput')?.value?.trim();
          const addressVal = document.getElementById('masterAddressInput')?.value?.trim();
          if (!nameVal) throw new Error('Nama Ordo / Kongregasi wajib diisi');
          payload = { name: nameVal };
          if (codeVal) payload.code = codeVal;
          if (addressVal) payload.address = addressVal;
          modal.data.name = nameVal;
          modal.data.code = codeVal;
          modal.data.address = addressVal;
        } else if (type === 'services') {
          endpoint = mode === 'CREATE' ? `${API_BASE}/master/service-categories` : `${API_BASE}/master/service-categories/${data.id}`;
          const nameVal = document.getElementById('masterNameInput')?.value?.trim();
          const descVal = document.getElementById('masterDescInput')?.value?.trim();
          const isUrgent = document.getElementById('masterIsUrgentInput')?.checked || false;
          const isActive = document.getElementById('masterIsActiveInput')?.checked !== false;
          if (!nameVal) throw new Error('Nama Sakramen / Pelayanan wajib diisi');
          payload = {
            name: nameVal,
            isUrgentByDefault: isUrgent,
            isActive: isActive
          };
          if (descVal) payload.description = descVal;
          modal.data.name = nameVal;
          modal.data.description = descVal;
          modal.data.is_urgent_by_default = isUrgent;
          modal.data.is_active = isActive;
        }

        // 2. Now set loading state and render spinner
        state.isSavingMaster = true;
        state.masterModalError = '';
        renderApp();

        // 3. Send request to backend
        const res = await fetch(endpoint, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await res.json();
        if (!res.ok) {
          const errMsg = Array.isArray(result.message) ? result.message.join(', ') : (result.message || 'Gagal menyimpan data.');
          throw new Error(errMsg);
        }

        state.activeMasterModal = null;
        await loadMasterData(state.masterSubTab);

        // Also refresh global lookups
        try {
          const [kRes, pRes, oRes, scRes] = await Promise.all([
            fetch(`${API_BASE}/master/keuskupan`),
            fetch(`${API_BASE}/master/paroki`),
            fetch(`${API_BASE}/master/ordo`),
            fetch(`${API_BASE}/master/service-categories`)
          ]);
          state.keuskupan = await kRes.json();
          state.paroki = await pRes.json();
          state.ordo = await oRes.json();
          state.serviceCategories = await scRes.json();
        } catch (_) {}
        renderApp();
      } catch (err) {
        state.masterModalError = err.message || 'Terjadi kesalahan sistem.';
        renderApp();
      } finally {
        state.isSavingMaster = false;
        renderApp();
      }
    }

    async function handleSaveProfile(e) {
      e.preventDefault();
      const u = state.activeEditUser;
      if (!u) return;

      const fullName = document.getElementById('editFullName').value.trim();
      const email = document.getElementById('editEmail').value.trim();
      const rawPhone = document.getElementById('editPhone').value.trim().replace(/\D/g, '');
      const roleCode = document.getElementById('editRoleCode').value;
      const accountStatus = document.getElementById('editAccountStatus').value;
      const birthDateInput = document.getElementById('editBirthDate') ? document.getElementById('editBirthDate').value : '';
      const address = document.getElementById('editAddress') ? document.getElementById('editAddress').value.trim() : '';

      // Validate Phone Number (Must start with 8 and be 9-13 digits)
      if (!rawPhone || !rawPhone.startsWith('8')) {
        state.editFormError = 'Nomor WhatsApp wajib diawali angka 8 (setelah kode negara +62).';
        renderApp();
        return;
      }
      if (rawPhone.length < 9 || rawPhone.length > 13) {
        state.editFormError = 'Panjang nomor WhatsApp minimal 9 dan maksimal 13 digit angka.';
        renderApp();
        return;
      }
      const formattedPhone = rawPhone.startsWith('62') ? rawPhone : ('62' + rawPhone);

      // Check if phone number is already used by another user
      const isDuplicatePhone = state.users.some(other => {
        if (String(other.id) === String(u.id)) return false;
        const otherPhone = String(other.phone_number || other.phoneNumber || '').trim().replace(/\D/g, '');
        const cleanOther = otherPhone.startsWith('62') ? otherPhone : ('62' + otherPhone.replace(/^0/, ''));
        return cleanOther === formattedPhone;
      });
      if (isDuplicatePhone) {
        state.editFormError = 'Nomor WhatsApp ini sudah digunakan oleh pengguna lain. Silakan gunakan nomor yang berbeda.';
        renderApp();
        return;
      }

      // Validate Email
      if (!email || !email.includes('@')) {
        state.editFormError = 'Format alamat email tidak valid.';
        renderApp();
        return;
      }

      const payload = {
        fullName,
        email,
        phoneNumber: formattedPhone,
        roleCode,
        accountStatus,
        address,
        birthDate: birthDateInput && birthDateInput.trim() ? birthDateInput.trim() : null,
      };

      const provElem = document.getElementById('editProvinsiId');
      if (provElem && provElem.value) payload.provinsiId = parseInt(provElem.value);

      const kkElem = document.getElementById('editKabupatenKotaId');
      if (kkElem && kkElem.value) payload.kabupatenKotaId = parseInt(kkElem.value);

      if (roleCode !== 'ROMO_ORDO') {
        const kElem = document.getElementById('editKeuskupanId');
        if (kElem && kElem.value) payload.keuskupanId = parseInt(kElem.value);

        const pElem = document.getElementById('editParokiId');
        if (pElem && pElem.value) payload.parokiId = parseInt(pElem.value);

        const wElem = document.getElementById('editWilayahId');
        if (wElem && wElem.value) payload.wilayahId = parseInt(wElem.value);

        const lElem = document.getElementById('editLingkunganId');
        if (lElem && lElem.value) payload.lingkunganId = parseInt(lElem.value);
      } else {
        const oElem = document.getElementById('editOrdoId');
        if (oElem && oElem.value) payload.ordoId = parseInt(oElem.value);
      }

      if (roleCode === 'PENGURUS_LINGKUNGAN') {
        const pos = document.getElementById('editPengurusPosition');
        if (pos) payload.pengurusPosition = pos.value;
        const sy = document.getElementById('editJabatanStartYear');
        if (sy && sy.value) payload.jabatanStartYear = parseInt(sy.value);
        const ey = document.getElementById('editJabatanEndYear');
        if (ey && ey.value) payload.jabatanEndYear = parseInt(ey.value);
        payload.isJabatanActive = true;

        // Check if another active/pending user already holds this position in the same lingkungan
        const checkLingkunganId = payload.lingkunganId || u.lingkungan_id;
        if (checkLingkunganId && payload.pengurusPosition) {
          const duplicatePengurus = state.users.find(other => {
            if (String(other.id) === String(u.id)) return false;
            const oStatus = (other.account_status || other.accountStatus || '').toUpperCase();
            if (oStatus !== 'APPROVED' && oStatus !== 'PENDING_APPROVAL') return false;
            const oLing = other.lingkungan_id || other.lingkunganId;
            if (String(oLing) !== String(checkLingkunganId)) return false;
            const oPos = (other.pengurus_position || other.pengurusPosition || '').toLowerCase();
            const myPos = payload.pengurusPosition.toLowerCase();
            if (oPos === myPos) return true;
            if (myPos.includes('ketua') && !myPos.includes('wakil') && oPos.includes('ketua') && !oPos.includes('wakil')) return true;
            if (myPos.includes('wakil') && oPos.includes('wakil')) return true;
            if (myPos.includes('sekretaris') && oPos.includes('sekretaris')) return true;
            if (myPos.includes('bendahara') && oPos.includes('bendahara')) return true;
            return false;
          });
          if (duplicatePengurus) {
            state.editFormError = `Jabatan ${payload.pengurusPosition} pada lingkungan ini sudah diisi oleh ${duplicatePengurus.full_name || duplicatePengurus.fullName}. Pengurus dengan jabatan yang sama tidak boleh ganda dalam satu lingkungan.`;
            renderApp();
            return;
          }
        }
      }

      if (roleCode === 'ROMO_PAROKI') {
        const rpos = document.getElementById('editRomoPosition');
        if (rpos) payload.romoPosition = rpos.value;
      }

      state.isSavingProfile = true;
      state.editFormError = '';
      renderApp();

      try {
        const res = await fetch(`${API_BASE}/auth/profile/${u.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (res.ok || data.statusCode === 200) {
          alert('✓ Profil pengguna berhasil diperbarui!');
          state.activeEditUser = null;
          state.isSavingProfile = false;
          state.editFormError = '';
          loadDashboardData();
        } else {
          const errMsg = Array.isArray(data.message) ? data.message.join(', ') : (data.message || 'Gagal menyimpan profil pengguna.');
          state.editFormError = errMsg;
          state.isSavingProfile = false;
          renderApp();
        }
      } catch (err) {
        state.editFormError = 'Terjadi kesalahan saat menghubungi server backend.';
        state.isSavingProfile = false;
        renderApp();
      }
    }

    async function approveUserAction(userId, action) {
      if (!confirm(`Apakah Anda yakin ingin mengubah status akun ini menjadi ${action}?`)) return;
      try {
        const res = await fetch(`${API_BASE}/auth/approve-registration`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ targetUserId: parseInt(userId), action }),
        });
        const data = await res.json();
        alert(data.message || 'Status akun berhasil diperbarui!');
        loadDashboardData();
      } catch (e) {
        alert('Gagal memperbarui status user');
      }
    }

    async function runTestsAction() {
      state.isRunningTests = true;
      renderApp();
      try {
        const res = await fetch(`${API_BASE}/test-runner/run-unit-tests`, { method: 'POST' });
        state.testResults = await res.json();
      } catch (e) {
        alert('Gagal menjalankan unit tests');
      }
      state.isRunningTests = false;
      renderApp();
    }

    function viewOrderDetail(orderId) {
      state.activeOrderDetail = state.orders.find(o => String(o.id) === String(orderId));
      renderApp();
    }

    function viewUserProfileModal(userId) {
      state.activeUserProfile = state.users.find(u => String(u.id) === String(userId));
      renderApp();
    }

    // Init
    renderApp();
    if (state.currentUser && (state.currentUser.roleCode === 'ADMIN' || state.currentUser.role_code === 'ADMIN')) {
      loadDashboardData();
    }
  </script>
</body>
</html>
